<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Haunted Mountain FPS - Stable</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21152e;font:12px monospace;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;z-index:5;top:10px;left:10px;padding:8px 12px;color:#dff;background:#09151dcc;border-left:3px solid #00ffd9;line-height:1.5;pointer-events:none}.bar{height:9px;width:145px;background:#401923;border:1px solid #fff5}.fill{height:100%;width:100%;background:#42ed82}#reticle{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}#reticle:before,#reticle:after{content:"";position:absolute;left:50%;top:50%;background:#fff;transform:translate(-50%,-50%)}#reticle:before{width:2px;height:22px}#reticle:after{width:22px;height:2px}#overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#000b}.panel{width:min(440px,94vw);padding:20px;text-align:center;color:#fff;background:#0e121bf2;border:1px solid #00ffd9;border-radius:10px}.panel h1{color:#00ffd9}.panel button,.weapon{padding:11px 14px;margin:4px;border:1px solid #00ffd9;border-radius:6px;background:#073b39;color:#fff;font:inherit;cursor:pointer}.weapon.active{background:#00ffd9;color:#001}.hidden{display:none!important}#count{font-size:60px;color:#ffcf5a}#joystick{position:fixed;z-index:10;left:18px;bottom:20px;width:130px;height:130px;border:2px solid #00ffd977;border-radius:50%;background:#00ffd91a}#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;border-radius:50%;background:#00ffd9bb;transform:translate(-50%,-50%)}.control{position:fixed;z-index:11;color:#fff;background:#17232dcc;border:1px solid #fff8;border-radius:8px;font:bold 11px monospace;touch-action:none}.round{width:68px;height:68px;border-radius:50%}#fire{right:20px;bottom:20px;background:#ff3f73aa}#sprint{left:160px;bottom:30px}#crouch,#prone,#jump,#aim,#interact{right:100px;width:64px;height:40px}#crouch{bottom:25px}#prone{bottom:72px}#jump{bottom:119px}#aim{bottom:166px}#interact{bottom:213px}.held{background:#00a993!important;color:#001!important}@media(max-width:420px){#sprint{left:145px}#crouch,#prone,#jump,#aim,#interact{right:88px}}
</style>
</head>
<body>
<div id="game"></div><div id="reticle"></div>
<div id="hud">HP <span id="hp">200</span>/200<div class="bar"><div id="hpbar" class="fill"></div></div>ARME <span id="gun">AK-47</span><br>SCORE <span id="score">0</span> · TEMPS <span id="time">03:00</span><br><span id="message">MENU</span></div>
<div id="overlay"><section class="panel" id="menu"><h1>HAUNTED MOUNTAIN</h1><p>Choisissez une arme puis lancez la partie.</p><div id="weapons"></div><button id="startButton" type="button">LANCER LA PARTIE</button></section><section class="panel hidden" id="countdown"><h1>DÉPART</h1><div id="count">10</div><p>Préparez-vous...</p></section><section class="panel hidden" id="end"><h1 id="endTitle">FIN</h1><p id="endText"></p><button id="restartButton" type="button">RETOUR AU MENU</button></section></div>
<div id="joystick"><div id="stick"></div></div><button id="fire" class="control round" type="button">TIR</button><button id="sprint" class="control round" type="button">SPRINT</button><button id="crouch" class="control" type="button">BAS</button><button id="prone" class="control" type="button">ALLONGÉ</button><button id="jump" class="control" type="button">SAUT</button><button id="aim" class="control" type="button">AIM</button><button id="interact" class="control" type="button">INTER</button>
<script>
'use strict';
let scene,camera,renderer,player,pitch,clock;
let mode='menu',selected='ak',score=0,hp=200,timeLeft=180,lastShot=0,countdownId=0;
const weapons={sniper:{name:'SNIPER',damage:150,rate:1.2,range:240},ak:{name:'AK-47',damage:30,rate:8,range:170},shotgun:{name:'POMPE',damage:100,rate:1.1,range:55},pistol:{name:'PISTOLET',damage:20,rate:4,range:120}};
const enemies=[],covers=[],chests=[],pads=[];const move={x:0,y:0};const keyState={sprint:false,crouch:false,prone:false,aim:false};const jump={ground:true,velocity:0};const joy={active:false,id:null,x:0,y:0,r:45};const look={active:false,id:null,x:0,y:0};
const $=id=>document.getElementById(id);const say=t=>$('message').textContent=t;
function material(c){return new THREE.MeshStandardMaterial({color:c,roughness:.9})}
function init(){clock=new THREE.Clock();scene=new THREE.Scene();scene.background=new THREE.Color(0x322543);scene.fog=new THREE.Fog(0x322543,45,240);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf5eaff,0x18241b,1.4));const sun=new THREE.DirectionalLight(0xffe5b5,1.7);sun.position.set(40,70,30);scene.add(sun);buildWorld();buildPlayer();buildEnemies();buildMenu();bindUI();addEventListener('resize',resize);animate()}
function buildWorld(){const floor=new THREE.Mesh(new THREE.PlaneGeometry(480,480),material(0x49634e));floor.rotation.x=-Math.PI/2;scene.add(floor);const house=new THREE.Mesh(new THREE.BoxGeometry(42,20,28),material(0x302b3d));house.position.set(0,10,-110);scene.add(house);const roof=new THREE.Mesh(new THREE.ConeGeometry(24,17,4),material(0x17111d));roof.position.set(0,24,-110);roof.rotation.y=Math.PI/4;scene.add(roof);for(let i=0;i<20;i++){const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2),material(0x697169));rock.position.set((Math.random()-.5)*220,1.5,(Math.random()-.5)*220);scene.add(rock);covers.push({mesh:rock,r:3.5})}for(let i=0;i<3;i++){const pad=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.5,12),material(0x35eaaa));pad.position.set((i-1)*38,.25,70+i*20);scene.add(pad);pads.push(pad)}[[-70,70],[70,-55],[0,115],[105,20]].forEach(([x,z],i)=>{const c=new THREE.Group(),body=new THREE.Mesh(new THREE.BoxGeometry(3,2,2),material(0x66411f)),lid=new THREE.Mesh(new THREE.BoxGeometry(3,.7,2.2),material(0x89552b));body.position.y=1;lid.position.y=2.2;c.add(body,lid);c.position.set(x,0,z);c.userData={opened:false,heal:i%2===1};scene.add(c);chests.push(c)})}
function buildPlayer(){player=new THREE.Object3D();pitch=new THREE.Object3D();player.position.set(0,2,25);pitch.add(camera);player.add(pitch);scene.add(player);const gun=new THREE.Mesh(new THREE.BoxGeometry(.6,.4,2.1),material(0x20252a));gun.position.set(.8,-.8,-1.7);camera.add(gun)}
function makeEnemy(){const g=new THREE.Group(),skin=material(0xe1bd98),cloth=material(0x7c2d3a),dark=material(0x22262e);const head=new THREE.Mesh(new THREE.SphereGeometry(.65,8,8),skin);head.position.y=2.4;head.userData.part='head';const torso=new THREE.Mesh(new THREE.CylinderGeometry(.7,.85,1.5,8),cloth);torso.position.y=1.1;torso.userData.part='torso';g.add(head,torso);for(const x of[-.3,.3]){const leg=new THREE.Mesh(new THREE.BoxGeometry(.35,1.7,.4),dark);leg.position.set(x,-.75,0);g.add(leg)}g.userData={hp:100,next:1+Math.random()*3,speed:2+Math.random()*2,phase:Math.random()*6};return g}
function buildEnemies(){for(let i=0;i<6;i++){const e=makeEnemy();respawn(e);scene.add(e);enemies.push(e)}}
function respawn(e){let x,z;do{x=(Math.random()-.5)*190;z=(Math.random()-.5)*190}while(Math.hypot(x-player.position.x,z-player.position.z)<35);e.position.set(x,0,z);e.visible=true;e.userData.hp=100;e.userData.next=1+Math.random()*3}
function buildMenu(){const box=$('weapons');Object.keys(weapons).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='weapon'+(k===selected?' active':'');b.textContent=weapons[k].name;b.addEventListener('click',()=>{selected=k;box.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('gun').textContent=weapons[k].name;say('ARME : '+weapons[k].name)});box.appendChild(b)})}
function bindUI(){ $('startButton').addEventListener('click',startCountdown);$('restartButton').addEventListener('click',resetToMenu);hold('sprint','sprint');hold('crouch','crouch');hold('prone','prone');$('aim').addEventListener('pointerdown',e=>{e.preventDefault();keyState.aim=!keyState.aim;$('aim').classList.toggle('held',keyState.aim)});$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='playing'&&jump.ground){jump.ground=false;jump.velocity=5.5}});$('interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});$('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});$('joystick').addEventListener('pointerdown',joyStart);$('joystick').addEventListener('pointermove',joyMove);$('joystick').addEventListener('pointerup',joyEnd);$('joystick').addEventListener('pointercancel',joyEnd);document.addEventListener('pointerdown',lookStart);document.addEventListener('pointermove',lookMove);document.addEventListener('pointerup',lookEnd);document.addEventListener('pointercancel',lookEnd)}
function hold(id,key){const b=$(id);const down=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keyState[key]=true;b.classList.add('held')};const up=e=>{e.preventDefault();keyState[key]=false;b.classList.remove('held')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
function startCountdown(){if(mode!=='menu')return;mode='countdown';$('menu').classList.add('hidden');$('countdown').classList.remove('hidden');let n=10;$('count').textContent=n;clearInterval(countdownId);countdownId=setInterval(()=>{n--;$('count').textContent=n;if(n<=0){clearInterval(countdownId);$('overlay').classList.add('hidden');mode='playing';say('SURVIVEZ')}} ,1000)}
function resetToMenu(){clearInterval(countdownId);mode='menu';score=0;hp=200;timeLeft=180;keyState.sprint=keyState.crouch=keyState.prone=keyState.aim=false;move.x=move.y=0;jump.ground=true;jump.velocity=0;enemies.forEach(respawn);chests.forEach(c=>{c.userData.opened=false;c.children[1].rotation.x=0});$('overlay').classList.remove('hidden');$('menu').classList.remove('hidden');$('countdown').classList.add('hidden');$('end').classList.add('hidden');$('aim').classList.remove('held');updateHUD();say('MENU')}
function lookStart(e){if(mode!=='playing'||e.target.closest('button')||e.target.closest('#joystick'))return;if(e.clientX>innerWidth*.3){look.active=true;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY}}function lookMove(e){if(!look.active||e.pointerId!==look.id)return;e.preventDefault();player.rotation.y-=(e.clientX-look.x)*.006;pitch.rotation.x=THREE.MathUtils.clamp(pitch.rotation.x-(e.clientY-look.y)*.006,-1.45,1.45);look.x=e.clientX;look.y=e.clientY}function lookEnd(e){if(e.pointerId===look.id)look.active=false}
function joyStart(e){e.preventDefault();const r=$('joystick').getBoundingClientRect();joy.active=true;joy.id=e.pointerId;joy.x=r.left+r.width/2;joy.y=r.top+r.height/2;joyMove(e)}function joyMove(e){if(!joy.active||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x,dy=e.clientY-joy.y,d=Math.hypot(dx,dy);if(d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r}move.x=dx/joy.r;move.y=-dy/joy.r;$('stick').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}function joyEnd(){joy.active=false;move.x=move.y=0;$('stick').style.transform='translate(-50%,-50%)'}
function shoot(){if(mode!=='playing')return;const w=weapons[selected],now=performance.now()/1000;if(now-lastShot<1/w.rate)return;lastShot=now;const o=new THREE.Vector3(),d=new THREE.Vector3();camera.getWorldPosition(o);camera.getWorldDirection(d);for(const e of enemies){const target=e.position.clone();target.y+=1.2;const to=target.sub(o),dist=to.length();if(dist>w.range)continue;if(to.normalize().dot(d)<.985)continue;const damage=selected==='sniper'?150:selected==='shotgun'?(dist<20?100:20):w.damage;e.userData.hp-=damage;if(e.userData.hp<=0){score+=100;respawn(e);say('CIBLE ÉLIMINÉE')}else say('IMPACT');break}say('TIR '+w.name)}
function interact(){if(mode!=='playing')return;for(const c of chests){if(!c.userData.opened&&c.position.distanceTo(player.position)<8){c.userData.opened=true;c.children[1].rotation.x=-1.1;if(c.userData.heal){hp=Math.min(200,hp+25);say('COFFRE : +25 HP')}else{const keys=Object.keys(weapons);selected=keys[Math.floor(Math.random()*keys.length)];$('gun').textContent=weapons[selected].name;say('NOUVELLE ARME')}return}}for(const p of pads)if(p.position.distanceTo(player.position)<7){hp=Math.min(200,hp+18);say('SOIN');return}}
function updatePlayer(dt){let speed=keyState.sprint?11:keyState.crouch?4.5:keyState.prone?2.5:6.5;if(keyState.aim)speed*=.8;const old=player.position.clone();player.translateZ(-move.y*speed*dt);player.translateX(move.x*speed*dt);for(const c of covers)if(player.position.distanceTo(c.mesh.position)<c.r+1.3){player.position.copy(old);break}if(!jump.ground){jump.velocity-=9.8*dt;player.position.y+=jump.velocity*dt;if(player.position.y<=2){player.position.y=2;jump.ground=true;jump.velocity=0}}camera.position.y=keyState.prone?.5:keyState.crouch?1:1.6}
function updateEnemies(dt){for(const e of enemies){if(!e.visible)continue;const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);e.userData.phase+=dt*3;if(d<110){if(d>16){e.position.x+=dx/d*e.userData.speed*dt;e.position.z+=dz/d*e.userData.speed*dt}e.rotation.y=Math.atan2(dx,dz)+Math.PI;e.userData.next-=dt;if(d<85&&e.userData.next<=0){enemyShoot(e);e.userData.next=1.5+Math.random()*2.5}}}}
function enemyShoot(e){const o=e.position.clone();o.y+=1.5;const d=player.position.clone().sub(o).normalize();if(covers.some(c=>new THREE.Raycaster(o,d,0,90).ray.intersectSphere(new THREE.Sphere(c.mesh.position,c.r))))return;hp=Math.max(0,hp-20);say('TOUCHÉ -20');if(hp<=0)finish('DÉFAITE')}
function finish(title){mode='over';$('overlay').classList.remove('hidden');$('end').classList.remove('hidden');$('menu').classList.add('hidden');$('countdown').classList.add('hidden');$('endTitle').textContent=title;$('endText').textContent='Score : '+score+' • HP : '+hp}
function updateHUD(){$('hp').textContent=Math.ceil(hp);$('hpbar').style.width=(hp/2)+'%';$('score').textContent=score;$('time').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(Math.max(0,Math.floor(timeLeft%60))).padStart(2,'0');$('gun').textContent=weapons[selected].name}
function update(dt){if(mode!=='playing')return;timeLeft-=dt;if(timeLeft<=0){finish('TEMPS ÉCOULÉ');return}updatePlayer(dt);updateEnemies(dt);pads.forEach(p=>p.rotation.y+=dt);updateHUD()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function animate(){requestAnimationFrame(animate);update(Math.min(clock.getDelta(),.05));renderer.render(scene,camera)}
window.addEventListener('error',e=>{console.error(e.message);say('ERREUR : rechargez la page')});init();
</script>
</body>
</html>
