<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Haunted Mountain FPS</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21152e;font:12px monospace;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;z-index:5;top:10px;left:10px;padding:8px 12px;color:#dff;background:#09151dcc;border-left:3px solid #00ffd9;line-height:1.5;pointer-events:none}.bar{height:9px;width:145px;background:#401923;border:1px solid #fff5}.fill{height:100%;width:100%;background:#42ed82}#reticle{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}#reticle:before,#reticle:after{content:"";position:absolute;left:50%;top:50%;background:#fff;transform:translate(-50%,-50%)}#reticle:before{width:2px;height:22px}#reticle:after{width:22px;height:2px}#overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#000b}.panel{width:min(440px,94vw);padding:20px;text-align:center;color:#fff;background:#0e121bf2;border:1px solid #00ffd9;border-radius:10px}.panel h1{color:#00ffd9}.panel button,.weapon{padding:11px 14px;margin:4px;border:1px solid #00ffd9;border-radius:6px;background:#073b39;color:#fff;font:inherit}.weapon.active{background:#00ffd9;color:#001}.hidden{display:none!important}#count{font-size:60px;color:#ffcf5a}#joystick{position:fixed;z-index:10;left:18px;bottom:20px;width:130px;height:130px;border:2px solid #00ffd977;border-radius:50%;background:#00ffd91a}#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;border-radius:50%;background:#00ffd9bb;transform:translate(-50%,-50%)}.control{position:fixed;z-index:11;color:#fff;background:#17232dcc;border:1px solid #fff8;border-radius:8px;font:bold 11px monospace;touch-action:none}.round{width:68px;height:68px;border-radius:50%}#fire{right:20px;bottom:20px;background:#ff3f73aa}#sprint{left:160px;bottom:30px}#crouch,#prone,#jump,#aim,#interact{right:100px;width:64px;height:40px}#crouch{bottom:25px}#prone{bottom:72px}#jump{bottom:119px}#aim{bottom:166px}#interact{bottom:213px}.held{background:#00a993!important;color:#001!important}#look{position:fixed;right:12px;bottom:110px;color:#fff8;pointer-events:none}@media(max-width:420px){#sprint{left:145px}#crouch,#prone,#jump,#aim,#interact{right:88px}}
</style>
</head>
<body>
<div id="game"></div><div id="reticle"></div>
<div id="hud">HP <span id="hp">200</span>/200<div class="bar"><div id="hpbar" class="fill"></div></div>ARME <span id="gun">AK-47</span><br>SCORE <span id="score">0</span> · TEMPS <span id="time">03:00</span><br><span id="message">PRÊT</span></div>
<div id="overlay"><div class="panel" id="menu"><h1>HAUNTED MOUNTAIN</h1><p>Choisissez une arme. Les boutons de déplacement sont actifs uniquement pendant leur pression. AIM reste en mode bascule.</p><div id="weapons"></div><button id="start" type="button">LANCER LA PARTIE</button></div><div class="panel hidden" id="countdown"><h1>DÉPART</h1><div id="count">10</div></div><div class="panel hidden" id="end"><h1 id="endTitle">FIN</h1><p id="endText"></p><button id="restart" type="button">REJOUER</button></div></div>
<div id="joystick"><div id="stick"></div></div><button id="fire" class="control round" type="button">TIR</button><button id="sprint" class="control round" type="button">SPRINT</button><button id="crouch" class="control" type="button">BAS</button><button id="prone" class="control" type="button">ALLONGÉ</button><button id="jump" class="control" type="button">SAUT</button><button id="aim" class="control" type="button">AIM</button><button id="interact" class="control" type="button">INTER</button><div id="look">GLISSEZ À DROITE POUR VISER</div>
<script>
'use strict';
const WEAPONS={sniper:{label:'SNIPER',damage:150,rate:1.2,range:250,pellets:1},ak:{label:'AK-47',damage:30,rate:8,range:180,pellets:1},shotgun:{label:'POMPE',damage:100,rate:1.1,range:58,pellets:8},pistol:{label:'PISTOLET',damage:20,rate:4.5,range:130,pellets:1}};
let scene,camera,renderer,player,pitch,clock,lastShot=0,gameMode='menu',selected='ak',score=0,hp=200,timeLeft=180;
const enemies=[],covers=[],chests=[],pads=[],effects=[];const move={forward:0,side:0};const state={sprint:false,crouch:false,prone:false,aim:false,onGround:true,jumpSpeed:0};const joy={active:false,id:null,cx:0,cy:0,r:46};const look={active:false,id:null,x:0,y:0};const $=id=>document.getElementById(id);const message=t=>$('message').textContent=t;
function mat(c,r=1,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
function init(){clock=new THREE.Clock();scene=new THREE.Scene();scene.background=new THREE.Color(0x332746);scene.fog=new THREE.Fog(0x332746,40,250);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.35));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf5eaff,0x17231c,1.35));let sun=new THREE.DirectionalLight(0xffe6b5,1.7);sun.position.set(40,70,30);scene.add(sun);world();createPlayer();createEnemies();makeMenu();bind();addEventListener('resize',resize);animate()}
function world(){let ground=new THREE.Mesh(new THREE.PlaneGeometry(500,500),mat(0x49634e));ground.rotation.x=-Math.PI/2;scene.add(ground);let road=new THREE.Mesh(new THREE.PlaneGeometry(30,220),mat(0x856e58));road.rotation.x=-Math.PI/2;road.position.y=.02;scene.add(road);let house=new THREE.Mesh(new THREE.BoxGeometry(44,20,28),mat(0x302b3d));house.position.set(0,10,-110);scene.add(house);let roof=new THREE.Mesh(new THREE.ConeGeometry(25,18,4),mat(0x15111e));roof.position.set(0,24,-110);roof.rotation.y=Math.PI/4;scene.add(roof);for(let i=0;i<16;i++){let p=new THREE.Mesh(new THREE.SphereGeometry(1,8,8),mat(0xe8752e));p.position.set(-20+i*2.6,1,-125+(i%2)*8);scene.add(p)}for(let i=0;i<20;i++){let o=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2),mat(0x6e746c));o.position.set((Math.random()-.5)*230,1.5,(Math.random()-.5)*230);scene.add(o);covers.push({mesh:o,r:4})}for(let i=0;i<8;i++){let o=new THREE.Mesh(new THREE.BoxGeometry(3,3,3),mat(0x77583b));o.position.set((Math.random()-.5)*180,1.5,(Math.random()-.5)*180);scene.add(o);covers.push({mesh:o,r:3.5})}for(let i=0;i<3;i++){let p=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.5,16),mat(0x3cffb0));p.position.set((i-1)*40,.3,75+i*20);scene.add(p);pads.push(p)}[[-70,70],[70,-55],[0,120],[110,20]].forEach(([x,z],i)=>{let c=new THREE.Group();let b=new THREE.Mesh(new THREE.BoxGeometry(3,2,2),mat(0x65411e));b.position.y=1;let l=new THREE.Mesh(new THREE.BoxGeometry(3,.7,2.2),mat(0x86542a));l.position.y=2.2;c.add(b,l);c.position.set(x,0,z);c.userData={opened:false,loot:i%2?'heal':'weapon'};scene.add(c);chests.push(c)})}
function createPlayer(){player=new THREE.Object3D();pitch=new THREE.Object3D();player.position.set(0,2,25);pitch.add(camera);player.add(pitch);scene.add(player);let gun=new THREE.Group();let body=new THREE.Mesh(new THREE.BoxGeometry(.6,.4,2.1),mat(0x20252a,.5,.8));body.position.set(.8,-.8,-1.7);let barrel=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,1.8,8),mat(0xaab7c0,.3,.8));barrel.rotation.z=Math.PI/2;barrel.position.set(1.45,-.8,-2.6);gun.add(body,barrel);camera.add(gun)}
function enemy(){let g=new THREE.Group(),skin=mat(0xe2bf99),cloth=mat(0x7d2e3c),dark=mat(0x22252d);let h=new THREE.Mesh(new THREE.SphereGeometry(.65,10,8),skin);h.position.y=2.4;h.userData.hit='head';let t=new THREE.Mesh(new THREE.CylinderGeometry(.7,.85,1.5,9),cloth);t.position.y=1.1;t.userData.hit='torso';let hip=new THREE.Mesh(new THREE.BoxGeometry(1,.45,.7),dark);hip.position.y=.3;let parts=[h,t,hip];for(let x of[-.9,.9]){let a=new THREE.Mesh(new THREE.CapsuleGeometry(.18,1.15,3,6),skin);a.position.set(x,1.1,0);parts.push(a)}for(let x of[-.3,.3]){let l=new THREE.Mesh(new THREE.CapsuleGeometry(.22,1.5,3,6),dark);l.position.set(x,-.75,0);parts.push(l)}g.add(...parts);g.userData={hp:100,next:1+Math.random()*3,speed:2+Math.random()*2,phase:Math.random()*6};return g}
function createEnemies(){for(let i=0;i<7;i++){let e=enemy();respawn(e);scene.add(e);enemies.push(e)}}function respawn(e){let x,z;do{x=(Math.random()-.5)*200;z=(Math.random()-.5)*200}while(Math.hypot(x-player.position.x,z-player.position.z)<35);e.position.set(x,0,z);e.visible=true;e.userData.hp=100;e.userData.next=1+Math.random()*3}
function makeMenu(){let root=$('weapons');Object.keys(WEAPONS).forEach(k=>{let b=document.createElement('button');b.type='button';b.className='weapon'+(k===selected?' active':'');b.textContent=WEAPONS[k].label;b.addEventListener('click',e=>{e.stopPropagation();selected=k;root.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('gun').textContent=WEAPONS[k].label;message('ARME : '+WEAPONS[k].label)});root.appendChild(b)})}
function bind(){ $('start').addEventListener('click',startCountdown);$('restart').addEventListener('click',()=>location.reload());buttonHold('sprint','sprint');buttonHold('crouch','crouch');buttonHold('prone','prone');$('jump').addEventListener('pointerdown',e=>{e.preventDefault();if(state.onGround){state.jumpSpeed=5.5;state.onGround=false}});$('aim').addEventListener('pointerdown',e=>{e.preventDefault();state.aim=!state.aim;$('aim').classList.toggle('held',state.aim)});$('interact').addEventListener('pointerdown',e=>{e.preventDefault();interact()});$('fire').addEventListener('pointerdown',e=>{e.preventDefault();shoot()});$('joystick').addEventListener('pointerdown',joyStart);$('joystick').addEventListener('pointermove',joyMove);$('joystick').addEventListener('pointerup',joyEnd);$('joystick').addEventListener('pointercancel',joyEnd);document.addEventListener('pointerdown',lookStart);document.addEventListener('pointermove',lookMove);document.addEventListener('pointerup',lookEnd);document.addEventListener('pointercancel',lookEnd)}
function buttonHold(id,key){let b=$(id);let down=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);state[key]=true;b.classList.add('held')};let up=e=>{e.preventDefault();state[key]=false;b.classList.remove('held')};b.addEventListener('pointerdown',down);b.addEventListener('pointerup',up);b.addEventListener('pointercancel',up);b.addEventListener('lostpointercapture',up)}
function startCountdown(){if(gameMode!=='menu')return;gameMode='countdown';$('menu').classList.add('hidden');$('countdown').classList.remove('hidden');let n=10;$('count').textContent=n;let iv=setInterval(()=>{--n;$('count').textContent=n;if(n<=0){clearInterval(iv);$('overlay').classList.add('hidden');gameMode='playing';message('SURVIVEZ')}} ,1000)}
function joyStart(e){e.preventDefault();let r=$('joystick').getBoundingClientRect();joy.active=true;joy.id=e.pointerId;joy.cx=r.left+r.width/2;joy.cy=r.top+r.height/2;joyMove(e)}function joyMove(e){if(!joy.active||e.pointerId!==joy.id)return;e.preventDefault();let dx=e.clientX-joy.cx,dy=e.clientY-joy.cy,d=Math.hypot(dx,dy);if(d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r}move.side=dx/joy.r;move.forward=-dy/joy.r;$('stick').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}function joyEnd(e){if(e.pointerId!==joy.id)return;joy.active=false;move.forward=move.side=0;$('stick').style.transform='translate(-50%,-50%)'}
function lookStart(e){if(gameMode!=='playing'||e.target.closest('button')||e.target.closest('#joystick'))return;if(e.clientX>innerWidth*.32){look.active=true;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY}}function lookMove(e){if(!look.active||e.pointerId!==look.id)return;e.preventDefault();player.rotation.y-=(e.clientX-look.x)*.006;pitch.rotation.x=THREE.MathUtils.clamp(pitch.rotation.x-(e.clientY-look.y)*.006,-1.45,1.45);look.x=e.clientX;look.y=e.clientY}function lookEnd(e){if(e.pointerId===look.id)look.active=false}
function shoot(){if(gameMode!=='playing')return;let w=WEAPONS[selected],now=performance.now()/1000;if(now-lastShot<1/w.rate)return;lastShot=now;let o=new THREE.Vector3(),dir=new THREE.Vector3();camera.getWorldPosition(o);camera.getWorldDirection(dir);let targets=[];enemies.forEach(e=>e.traverse(x=>{if(x.isMesh)targets.push(x)}));for(let i=0;i<w.pellets;i++){let d=dir.clone();d.x+=(Math.random()-.5)*(selected==='shotgun'?.08:.01);d.y+=(Math.random()-.5)*(selected==='shotgun'?.08:.01);d.normalize();let hit=new THREE.Raycaster(o,d,0,w.range).intersectObjects(targets,false)[0];if(!hit)continue;let e=hit.object;while(e.parent&&!e.userData.hp)e=e.parent;if(!e.userData.hp)continue;let damage=hit.object.userData.hit==='head'?w.damage*2:w.damage;if(selected==='shotgun'&&hit.distance>20)damage=20;e.userData.hp-=damage;if(e.userData.hp<=0){score+=100;$('score').textContent=score;respawn(e);message('CIBLE ÉLIMINÉE')}else if(hit.object.userData.hit==='head')message('HEADSHOT')}}message('TIR '+w.label)}
function interact(){if(gameMode!=='playing')return;for(let c of chests)if(!c.userData.opened&&c.position.distanceTo(player.position)<8){c.userData.opened=true;c.children[1].rotation.x=-1.1;if(c.userData.loot==='heal'){hp=Math.min(200,hp+25);message('COFFRE : +25 HP')}else{let keys=Object.keys(WEAPONS);selected=keys[Math.floor(Math.random()*keys.length)];$('gun').textContent=WEAPONS[selected].label;message('COFFRE : '+WEAPONS[selected].label)}return}for(let p of pads)if(p.position.distanceTo(player.position)<7){hp=Math.min(200,hp+18);message('SOIN');return}}
function updatePlayer(dt){let speed=state.sprint?11:state.crouch?4.5:state.prone?2.5:6.5;if(state.aim)speed*=.8;let old=player.position.clone();player.translateZ(-move.forward*speed*dt);player.translateX(move.side*speed*dt);for(let c of covers)if(player.position.distanceTo(c.mesh.position)<c.r+1.4){player.position.copy(old);break}player.position.x=THREE.MathUtils.clamp(player.position.x,-240,240);player.position.z=THREE.MathUtils.clamp(player.position.z,-240,240);if(!state.onGround){state.jumpSpeed-=9.8*dt;player.position.y+=state.jumpSpeed*dt;if(player.position.y<=2){player.position.y=2;state.onGround=true}}camera.position.y=state.prone?.5:state.crouch?1:1.6}
function updateEnemies(dt){for(let e of enemies){if(!e.visible)continue;e.userData.phase+=dt*3;let dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);if(d<120){if(d>16){let old=e.position.clone();e.position.x+=dx/d*e.userData.speed*dt;e.position.z+=dz/d*e.userData.speed*dt;if(covers.some(c=>e.position.distanceTo(c.mesh.position)<c.r+1)){e.position.copy(old);e.userData.speed*=-1}}e.rotation.y=Math.atan2(dx,dz)+Math.PI;e.userData.next-=dt;if(d<90&&e.userData.next<=0){enemyShoot(e);e.userData.next=1.3+Math.random()*2.8}}e.position.y=Math.sin(e.userData.phase)*.04}}
function enemyShoot(e){let o=e.position.clone();o.y+=1.5;let d=player.position.clone().sub(o).normalize();let ray=new THREE.Raycaster(o,d,0,90);if(covers.some(c=>ray.ray.intersectSphere(new THREE.Sphere(c.mesh.position,c.r))!==null))return;hp=Math.max(0,hp-20);message('TOUCHÉ -20');if(hp<=0)finish('DÉFAITE')}
function finish(t){gameMode='over';$('overlay').classList.remove('hidden');$('end').classList.remove('hidden');$('endTitle').textContent=t;$('endText').textContent='Score : '+score+' • HP : '+hp}
function update(dt){if(gameMode!=='playing')return;timeLeft-=dt;if(timeLeft<=0)return finish('TEMPS ÉCOULÉ');for(let p of pads)p.rotation.y+=dt;updatePlayer(dt);updateEnemies(dt);$('hp').textContent=Math.ceil(hp);$('hpbar').style.width=hp/2+'%';$('time').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(Math.floor(timeLeft%60)).padStart(2,'0')}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function animate(){requestAnimationFrame(animate);let dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}
init();
</script>
</body></html>
