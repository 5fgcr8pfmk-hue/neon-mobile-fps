<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache,no-store,must-revalidate"><title>Haunted Mountain FPS - 60 FPS</title><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#21152e;font:12px monospace;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;z-index:5;top:10px;left:10px;padding:8px 12px;color:#dff;background:#09151dcc;border-left:3px solid #00ffd9;line-height:1.5;pointer-events:none}.bar{height:9px;width:145px;background:#401923;border:1px solid #fff5}.fill{height:100%;background:#42ed82;width:100%}#reticle{position:fixed;z-index:4;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);pointer-events:none}#reticle:before,#reticle:after{content:"";position:absolute;left:50%;top:50%;background:#fff;transform:translate(-50%,-50%)}#reticle:before{width:2px;height:22px}#reticle:after{width:22px;height:2px}#overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;padding:18px;background:#000b}.panel{width:min(440px,94vw);padding:20px;text-align:center;color:#fff;background:#0e121bf2;border:1px solid #00ffd9;border-radius:10px}.panel h1{color:#00ffd9}.panel button,.weapon{padding:11px 14px;margin:4px;border:1px solid #00ffd9;border-radius:6px;background:#073b39;color:#fff;font:inherit}.weapon.active{background:#00ffd9;color:#001}.hidden{display:none!important}#count{font-size:60px;color:#ffcf5a}#joystick{position:fixed;z-index:10;left:18px;bottom:20px;width:130px;height:130px;border:2px solid #00ffd977;border-radius:50%;background:#00ffd91a}#stick{position:absolute;left:50%;top:50%;width:55px;height:55px;border-radius:50%;background:#00ffd9bb;transform:translate(-50%,-50%)}.control{position:fixed;z-index:11;color:#fff;background:#17232dcc;border:1px solid #fff8;border-radius:8px;font:bold 11px monospace;touch-action:none}.round{width:68px;height:68px;border-radius:50%}#fire{right:20px;bottom:20px;background:#ff3f73aa}#sprint{left:160px;bottom:30px}#crouch,#prone,#jump,#aim,#interact{right:100px;width:64px;height:40px}#crouch{bottom:25px}#prone{bottom:72px}#jump{bottom:119px}#aim{bottom:166px}#interact{bottom:213px}.held{background:#00a993!important;color:#001!important}@media(max-width:420px){#sprint{left:145px}#crouch,#prone,#jump,#aim,#interact{right:88px}}</style></head><body><div id="game"></div><div id="reticle"></div><div id="hud">HP <span id="hp">200</span>/200<div class="bar"><div id="hpbar" class="fill"></div></div>ARME <span id="gun">AK-47</span><br>SCORE <span id="score">0</span> · TEMPS <span id="time">03:00</span><br><span id="message">MENU</span></div><div id="overlay"><section class="panel" id="menu"><h1>HAUNTED MOUNTAIN</h1><p>Version optimisée 60 FPS pour Safari mobile.</p><div id="weapons"></div><button id="startButton" type="button">LANCER LA PARTIE</button></section><section class="panel hidden" id="countdown"><h1>DÉPART</h1><div id="count">10</div></section><section class="panel hidden" id="end"><h1 id="endTitle">FIN</h1><p id="endText"></p><button id="restartButton" type="button">RETOUR AU MENU</button></section></div><div id="joystick"><div id="stick"></div></div><button id="fire" class="control round" type="button">TIR</button><button id="sprint" class="control round" type="button">SPRINT</button><button id="crouch" class="control" type="button">BAS</button><button id="prone" class="control" type="button">ALLONGÉ</button><button id="jump" class="control" type="button">SAUT</button><button id="aim" class="control" type="button">AIM</button><button id="interact" class="control" type="button">INTER</button><script>'use strict';
const guns={sniper:{n:'SNIPER',d:150,r:1.2,range:240},ak:{n:'AK-47',d:30,r:8,range:170},shotgun:{n:'POMPE',d:100,r:1.1,range:55},pistol:{n:'PISTOLET',d:20,r:4,range:120}};let scene,camera,renderer,player,pitch,clock,lastShot=0,mode='menu',selected='ak',score=0,hp=200,time=180,countdownTimer;const enemies=[],covers=[],chests=[],pads=[];const move={x:0,y:0},keys={sprint:false,crouch:false,prone:false,aim:false},jump={ground:true,v:0},joy={on:false,id:null,x:0,y:0,r:45},look={on:false,id:null,x:0,y:0};const $=id=>document.getElementById(id);const say=t=>$('message').textContent=t;const mat=c=>new THREE.MeshStandardMaterial({color:c,roughness:.9});
function init(){clock=new THREE.Clock();scene=new THREE.Scene();scene.background=new THREE.Color(0x322543);scene.fog=new THREE.Fog(0x322543,45,240);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);scene.add(new THREE.HemisphereLight(0xf5eaff,0x18241b,1.4));const sun=new THREE.DirectionalLight(0xffe5b5,1.7);sun.position.set(40,70,30);scene.add(sun);world();makePlayer();makeEnemies();makeMenu();bind();addEventListener('resize',resize);requestAnimationFrame(frame)}
function world(){const floor=new THREE.Mesh(new THREE.PlaneGeometry(480,480),mat(0x49634e));floor.rotation.x=-Math.PI/2;scene.add(floor);const house=new THREE.Mesh(new THREE.BoxGeometry(42,20,28),mat(0x302b3d));house.position.set(0,10,-110);scene.add(house);const roof=new THREE.Mesh(new THREE.ConeGeometry(24,17,4),mat(0x17111d));roof.position.set(0,24,-110);roof.rotation.y=Math.PI/4;scene.add(roof);for(let i=0;i<14;i++){const o=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2),mat(0x697169));o.position.set((Math.random()-.5)*220,1.5,(Math.random()-.5)*220);scene.add(o);covers.push({m:o,r:3.5})}for(let i=0;i<3;i++){const p=new THREE.Mesh(new THREE.CylinderGeometry(3,3,.5,12),mat(0x35eaaa));p.position.set((i-1)*38,.25,70+i*20);scene.add(p);pads.push(p)}[[-70,70],[70,-55],[0,115],[105,20]].forEach(([x,z],i)=>{const c=new THREE.Group(),b=new THREE.Mesh(new THREE.BoxGeometry(3,2,2),mat(0x66411f)),l=new THREE.Mesh(new THREE.BoxGeometry(3,.7,2.2),mat(0x89552b));b.position.y=1;l.position.y=2.2;c.add(b,l);c.position.set(x,0,z);c.userData={open:false,heal:i%2};scene.add(c);chests.push(c)})}
function makePlayer(){player=new THREE.Object3D();pitch=new THREE.Object3D();player.position.set(0,2,25);pitch.add(camera);player.add(pitch);scene.add(player);const gun=new THREE.Mesh(new THREE.BoxGeometry(.6,.4,2.1),mat(0x20252a));gun.position.set(.8,-.8,-1.7);camera.add(gun)}
function makeEnemy(){const g=new THREE.Group(),skin=mat(0xe1bd98),cloth=mat(0x7c2d3a),dark=mat(0x22262e),h=new THREE.Mesh(new THREE.SphereGeometry(.65,8,8),skin),t=new THREE.Mesh(new THREE.CylinderGeometry(.7,.85,1.5,8),cloth);h.position.y=2.4;h.userData.part='head';t.position.y=1.1;t.userData.part='torso';g.add(h,t);for(const x of[-.3,.3]){const l=new THREE.Mesh(new THREE.BoxGeometry(.35,1.7,.4),dark);l.position.set(x,-.75,0);g.add(l)}g.userData={hp:100,next:1+Math.random()*3,speed:2+Math.random()*2};return g}
function makeEnemies(){for(let i=0;i<6;i++){const e=makeEnemy();respawn(e);scene.add(e);enemies.push(e)}}function respawn(e){let x,z;do{x=(Math.random()-.5)*190;z=(Math.random()-.5)*190}while(Math.hypot(x-player.position.x,z-player.position.z)<35);e.position.set(x,0,z);e.visible=true;e.userData.hp=100;e.userData.next=1+Math.random()*3}
function makeMenu(){const box=$('weapons');Object.keys(guns).forEach(k=>{const b=document.createElement('button');b.type='button';b.className='weapon'+(k===selected?' active':'');b.textContent=guns[k].n;b.onclick=()=>{selected=k;box.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('gun').textContent=guns[k].n;say('ARME : '+guns[k].n)};box.appendChild(b)})}
function bind(){ $('startButton').onclick=startCountdown;$('restartButton').onclick=resetMenu;hold('sprint','sprint');hold('crouch','crouch');hold('prone','prone');$('aim').onpointerdown=e=>{e.preventDefault();keys.aim=!keys.aim;$('aim').classList.toggle('held',keys.aim)};$('jump').onpointerdown=e=>{e.preventDefault();if(mode==='playing'&&jump.ground){jump.ground=false;jump.v=5.5}};$('interact').onpointerdown=e=>{e.preventDefault();interact()};$('fire').onpointerdown=e=>{e.preventDefault();shoot()};$('joystick').onpointerdown=joyStart;$('joystick').onpointermove=joyMove;$('joystick').onpointerup=joyEnd;$('joystick').onpointercancel=joyEnd;document.onpointerdown=lookStart;document.onpointermove=lookMove;document.onpointerup=lookEnd;document.onpointercancel=lookEnd}
function hold(id,k){const b=$(id);const down=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);keys[k]=true;b.classList.add('held')},up=e=>{e.preventDefault();keys[k]=false;b.classList.remove('held')};b.onpointerdown=down;b.onpointerup=up;b.onpointercancel=up;b.onlostpointercapture=up}
function startCountdown(){if(mode!=='menu')return;mode='countdown';$('menu').classList.add('hidden');$('countdown').classList.remove('hidden');let n=10;$('count').textContent=n;clearInterval(countdownTimer);countdownTimer=setInterval(()=>{n--;$('count').textContent=n;if(n<=0){clearInterval(countdownTimer);$('overlay').classList.add('hidden');mode='playing';say('SURVIVEZ')}},1000)}
function resetMenu(){clearInterval(countdownTimer);mode='menu';score=0;hp=200;time=180;keys.sprint=keys.crouch=keys.prone=keys.aim=false;move.x=move.y=0;jump.ground=true;jump.v=0;enemies.forEach(respawn);chests.forEach(c=>{c.userData.open=false;c.children[1].rotation.x=0});$('overlay').classList.remove('hidden');$('menu').classList.remove('hidden');$('countdown').classList.add('hidden');$('end').classList.add('hidden');$('aim').classList.remove('held');updateHUD();say('MENU')}
function joyStart(e){e.preventDefault();const r=$('joystick').getBoundingClientRect();joy.on=true;joy.id=e.pointerId;joy.x=r.left+r.width/2;joy.y=r.top+r.height/2;joyMove(e)}function joyMove(e){if(!joy.on||e.pointerId!==joy.id)return;let dx=e.clientX-joy.x,dy=e.clientY-joy.y,d=Math.hypot(dx,dy);if(d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r}move.x=dx/joy.r;move.y=-dy/joy.r;$('stick').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}function joyEnd(){joy.on=false;move.x=move.y=0;$('stick').style.transform='translate(-50%,-50%)'}
function lookStart(e){if(mode!=='playing'||e.target.closest('button')||e.target.closest('#joystick')||e.clientX<innerWidth*.3)return;look.on=true;look.id=e.pointerId;look.x=e.clientX;look.y=e.clientY}function lookMove(e){if(!look.on||e.pointerId!==look.id)return;e.preventDefault();player.rotation.y-=(e.clientX-look.x)*.006;pitch.rotation.x=THREE.MathUtils.clamp(pitch.rotation.x-(e.clientY-look.y)*.006,-1.45,1.45);look.x=e.clientX;look.y=e.clientY}function lookEnd(e){if(e.pointerId===look.id)look.on=false}
function shoot(){if(mode!=='playing')return;const w=guns[selected],now=performance.now()/1000;if(now-lastShot<1/w.r)return;lastShot=now;const o=new THREE.Vector3(),d=new THREE.Vector3();camera.getWorldPosition(o);camera.getWorldDirection(d);for(const e of enemies){const to=e.position.clone().add(new THREE.Vector3(0,1.2,0)).sub(o),dist=to.length();if(dist>w.range||to.normalize().dot(d)<.985)continue;let damage=selected==='shotgun'?(dist<20?100:20):w.d;e.userData.hp-=damage;if(e.userData.hp<=0){score+=100;respawn(e);say('CIBLE ÉLIMINÉE')}else say('IMPACT');break}}
function interact(){if(mode!=='playing')return;for(const c of chests)if(!c.userData.open&&c.position.distanceTo(player.position)<8){c.userData.open=true;c.children[1].rotation.x=-1.1;if(c.userData.heal){hp=Math.min(200,hp+25);say('COFFRE : +25 HP')}else{const a=Object.keys(guns);selected=a[Math.random()*a.length|0];$('gun').textContent=guns[selected].n;say('NOUVELLE ARME')}return}for(const p of pads)if(p.position.distanceTo(player.position)<7){hp=Math.min(200,hp+18);say('SOIN');return}}
function updatePlayer(dt){let speed=keys.sprint?11:keys.crouch?4.5:keys.prone?2.5:6.5;if(keys.aim)speed*=.8;const old=player.position.clone();player.translateZ(-move.y*speed*dt);player.translateX(move.x*speed*dt);for(const c of covers)if(player.position.distanceTo(c.m)<c.r+1.3){player.position.copy(old);break}if(!jump.ground){jump.v-=9.8*dt;player.position.y+=jump.v*dt;if(player.position.y<=2){player.position.y=2;jump.ground=true;jump.v=0}}camera.position.y=keys.prone?.5:keys.crouch?1:1.6}
function updateEnemies(dt){for(const e of enemies){if(!e.visible)continue;const dx=player.position.x-e.position.x,dz=player.position.z-e.position.z,d=Math.hypot(dx,dz);if(d<110){if(d>16){e.position.x+=dx/d*e.userData.speed*dt;e.position.z+=dz/d*e.userData.speed*dt}e.rotation.y=Math.atan2(dx,dz)+Math.PI;e.userData.next-=dt;if(d<85&&e.userData.next<=0){enemyShoot(e);e.userData.next=1.5+Math.random()*2.5}}}}
function enemyShoot(e){const o=e.position.clone();o.y+=1.5;const d=player.position.clone().sub(o).normalize();const ray=new THREE.Raycaster(o,d,0,90);if(covers.some(c=>ray.ray.intersectSphere(new THREE.Sphere(c.m,c.r))))return;hp=Math.max(0,hp-20);say('TOUCHÉ -20');if(hp<=0)finish('DÉFAITE')}
function finish(t){mode='over';$('overlay').classList.remove('hidden');$('end').classList.remove('hidden');$('menu').classList.add('hidden');$('countdown').classList.add('hidden');$('endTitle').textContent=t;$('endText').textContent='Score : '+score+' • HP : '+hp}
function updateHUD(){$('hp').textContent=Math.ceil(hp);$('hpbar').style.width=hp/2+'%';$('score').textContent=score;$('time').textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(Math.max(0,Math.floor(time%60))).padStart(2,'0');$('gun').textContent=guns[selected].n}
function update(dt){if(mode!=='playing')return;time-=dt;if(time<=0)return finish('TEMPS ÉCOULÉ');updatePlayer(dt);updateEnemies(dt);pads.forEach(p=>p.rotation.y+=dt);updateHUD()}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
const STEP=1000/60;let previous=0,carry=0;function frame(now){requestAnimationFrame(frame);if(!previous)previous=now;let elapsed=Math.min(now-previous,100);previous=now;carry+=elapsed;if(carry<STEP)return;const dt=Math.min(carry/1000,.05);carry=0;update(dt);renderer.render(scene,camera)}
init();</script></body></html>
