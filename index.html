<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Neon Mountain FPS</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#9ad3ff;font:12px monospace;touch-action:none}#game{position:fixed;inset:0}canvas{display:block}#hud{position:fixed;z-index:5;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));padding:8px 12px;color:#dff;background:#07131dcc;border-left:3px solid #00ffd9;line-height:1.55;pointer-events:none}.bar{width:150px;height:10px;background:#32151b;border:1px solid #fff5}.fill{height:100%;background:#31ed77;width:100%}#reticle{position:fixed;z-index:4;top:50%;left:50%;width:12px;height:12px;border:2px solid #00ffd9;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;box-shadow:0 0 10px #00ffd9}#overlay{position:fixed;z-index:20;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;background:#000b;padding:20px}.panel{width:min(460px,100%);padding:22px;background:#07131df2;border:1px solid #00ffd9;box-shadow:0 0 25px #00ffd955}.panel h1{color:#00ffd9;margin:0 0 12px}.panel button,.weapon{border:1px solid #00ffd9;background:#073c3a;color:#dff;padding:11px 10px;margin:4px;font:inherit;border-radius:5px;cursor:pointer}.panel button:active,.weapon:active{transform:scale(.96)}.panel button.active,.weapon.active{background:#00ffd9;color:#00130f}.hidden{display:none!important}#count{font-size:64px;color:#ffcf5a;margin:18px}#joystick{position:fixed;z-index:10;left:max(20px,env(safe-area-inset-left));bottom:max(20px,env(safe-area-inset-bottom));width:130px;height:130px;border:2px solid #00ffd977;border-radius:50%;background:#00ffd91a}#stick{position:absolute;left:50%;top:50%;width:56px;height:56px;border-radius:50%;background:#00ffd9bb;transform:translate(-50%,-50%)}.control{position:fixed;z-index:10;color:#fff;background:#17232dcc;border:1px solid #fff8;border-radius:50%;font:bold 11px monospace;cursor:pointer}.control:active{background:#00ffd9;color:#001}.round{width:65px;height:65px}.small{width:52px;height:42px;border-radius:7px}.position{right:max(16px,env(safe-area-inset-right));bottom:max(125px,calc(env(safe-area-inset-bottom) + 105px))}#fire{right:max(24px,env(safe-area-inset-right));bottom:max(25px,env(safe-area-inset-bottom));width:84px;height:84px;border-color:#ff3970;background:#ff397055}#sprint{left:170px;bottom:max(32px,env(safe-area-inset-bottom))}#crouch{right:max(120px,calc(env(safe-area-inset-right) + 105px));bottom:max(28px,env(safe-area-inset-bottom))}#prone{right:max(120px,calc(env(safe-area-inset-right) + 105px));bottom:max(82px,env(safe-area-inset-bottom))}#look{position:fixed;right:15px;bottom:135px;color:#fff8;pointer-events:none}@media(max-height:450px){#hud{font-size:10px}.round{width:55px;height:55px}#sprint{left:155px}}
</style>
</head>
<body>
<div id="game"></div><div id="reticle"></div>
<div id="hud">HP <span id="hpText">200</span>/200<div class="bar"><div id="hpBar" class="fill"></div></div>ARME <span id="weaponText">AK-47</span><br>SCORE <span id="score">0</span> · TEMPS <span id="timer">03:00</span><br><span id="msg">PRÊT</span></div>
<div id="overlay"><div class="panel" id="menu"><h1>NEON MOUNTAIN FPS</h1><p id="menuInfo">Choisissez une arme puis appuyez sur « LANCER ».</p><div id="weapons"></div><br><button type="button" id="startButton">LANCER LA PARTIE</button></div><div class="panel hidden" id="countdown"><h1>DÉPART</h1><div id="count">10</div><p>Préparez-vous...</p></div><div class="panel hidden" id="end"><h1 id="endTitle">PARTIE TERMINÉE</h1><p id="endText"></p><button type="button" id="restart">REJOUER</button></div></div>
<div id="joystick"><div id="stick"></div></div><button type="button" id="fire" class="control round">TIR</button><button type="button" id="sprint" class="control round">SPRINT</button><button type="button" id="crouch" class="control small">BAISSER</button><button type="button" id="prone" class="control small">ALLONGÉ</button><div id="look">GLISSEZ À DROITE POUR VISER</div>
<script>
'use strict';
const WEAPONS={sniper:{label:'SNIPER',damage:150,rate:1.25,range:260,pellets:1},ak:{label:'AK-47',damage:30,rate:8,range:170,pellets:1},shotgun:{label:'POMPE',damage:100,rate:1.1,range:55,pellets:8},pistol:{label:'PISTOLET',damage:20,rate:4,range:120,pellets:1}};
let scene,camera,renderer,player,pitch,clock,weaponView,gameState='menu',score=0,hp=200,timeLeft=180,lastShot=0,countdownTimer=null;const enemies=[],obstacles=[];let selected='ak';const input={f:0,s:0,sprint:false,crouch:false,prone:false};let aim={on:false,x:0,y:0},joy={on:false,id:null,cx:0,cy:0,r:46};const $=id=>document.getElementById(id);const setMsg=t=>{$('msg').textContent=t};
function init(){clock=new THREE.Clock();scene=new THREE.Scene();scene.background=new THREE.Color(0x9ad3ff);scene.fog=new THREE.Fog(0x9ad3ff,55,270);camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,500);renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.5));renderer.setSize(innerWidth,innerHeight);$('game').appendChild(renderer.domElement);lights();world();playerInit();enemyInit();buildMenu();controls();addEventListener('resize',resize);animate()}
function lights(){scene.add(new THREE.HemisphereLight(0xeaffff,0x26362d,1.5));const s=new THREE.DirectionalLight(0xfff0c2,2);s.position.set(50,90,30);scene.add(s);const r=new THREE.DirectionalLight(0x8edbff,.8);r.position.set(-60,30,-40);scene.add(r)}
function material(c,r=1,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m})}
function world(){const ground=new THREE.Mesh(new THREE.PlaneGeometry(520,520),material(0x769769));ground.rotation.x=-Math.PI/2;scene.add(ground);const road=new THREE.Mesh(new THREE.PlaneGeometry(30,240),material(0x927d5b));road.rotation.x=-Math.PI/2;road.position.y=.02;scene.add(road);for(let i=0;i<16;i++){const m=new THREE.Mesh(new THREE.ConeGeometry(18+Math.random()*20,45+Math.random()*45,8),material(0x53665f));m.position.set((Math.random()-.5)*380,20,-100-Math.random()*130);scene.add(m);const snow=new THREE.Mesh(new THREE.ConeGeometry(8,14,6),material(0xf1f6ff));snow.position.y=25;m.add(snow)}for(let i=0;i<35;i++){const o=new THREE.Mesh(new THREE.DodecahedronGeometry(2+Math.random()*2),material(0x717c77));o.position.set((Math.random()-.5)*240,1,(Math.random()-.5)*240);scene.add(o);obstacles.push({mesh:o,r:3})}for(let i=0;i<12;i++){const o=new THREE.Mesh(new THREE.BoxGeometry(3,3,3),material(0x8b6845));o.position.set((Math.random()-.5)*190,1.5,(Math.random()-.5)*190);scene.add(o);obstacles.push({mesh:o,r:2.4})}}
function playerInit(){player=new THREE.Object3D();pitch=new THREE.Object3D();player.position.set(0,2,25);pitch.add(camera);player.add(pitch);scene.add(player);weaponView=new THREE.Group();const body=new THREE.Mesh(new THREE.BoxGeometry(.65,.4,2.2),material(0x20252a,.5,.8));body.position.set(.8,-.78,-1.7);const barrel=new THREE.Mesh(new THREE.CylinderGeometry(.11,.11,1.8,8),material(0xadb9bd,.3,.9));barrel.rotation.z=Math.PI/2;barrel.position.set(1.5,-.78,-2.7);const grip=new THREE.Mesh(new THREE.BoxGeometry(.2,.75,.25),material(0x272727));grip.position.set(.6,-1.15,-.8);weaponView.add(body,barrel,grip);weaponView.position.set(.45,0,0);camera.add(weaponView)}
function humanoid(){const g=new THREE.Group(),skin=material(0xe0b891),cloth=material(0x7c293b),dark=material(0x202329,.8,.2);const head=new THREE.Mesh(new THREE.SphereGeometry(.65,10,8),skin);head.position.y=2.45;head.userData.hit='head';g.add(head);const torso=new THREE.Mesh(new THREE.CylinderGeometry(.68,.82,1.5,8),cloth);torso.position.y=1.15;torso.userData.hit='torso';g.add(torso);const hip=new THREE.Mesh(new THREE.BoxGeometry(1,.45,.7),dark);hip.position.y=.3;g.add(hip);for(const x of[-.9,.9]){const a=new THREE.Mesh(new THREE.CapsuleGeometry(.17,1.15,3,6),skin);a.position.set(x,1.1,0);a.rotation.z=x*.5;g.add(a)}for(const x of[-.3,.3]){const l=new THREE.Mesh(new THREE.CapsuleGeometry(.22,1.55,3,6),dark);l.position.set(x,-.75,0);g.add(l)}return g}
function enemyInit(){for(let i=0;i<10;i++){const e=humanoid();e.userData={hp:100,phase:Math.random()*6.28,nextShot:2+Math.random()*3,speed:2+Math.random()*1.8,strafe:Math.random()>.5?1:-1};respawn(e);scene.add(e);enemies.push(e)}}function respawn(e){let x,z;do{x=(Math.random()-.5)*210;z=(Math.random()-.5)*210}while(Math.hypot(x-player.position.x,z-player.position.z)<35);e.position.set(x,0,z);e.userData.hp=100;e.userData.nextShot=1.5+Math.random()*3;e.visible=true}
function buildMenu(){const box=$('weapons');box.innerHTML='';Object.keys(WEAPONS).forEach(key=>{const b=document.createElement('button');b.type='button';b.className='weapon'+(key===selected?' active':'');b.textContent=WEAPONS[key].label;b.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();selected=key;box.querySelectorAll('.weapon').forEach(x=>x.classList.remove('active'));b.classList.add('active');$('weaponText').textContent=WEAPONS[key].label;$('menuInfo').textContent=WEAPONS[key].label+' sélectionné. Appuyez sur « LANCER ».';setMsg('ARME : '+WEAPONS[key].label)});box.appendChild(b)})}
function controls(){ $('startButton').addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();startCountdown()});$('restart').addEventListener('click',()=>location.reload());$('fire').addEventListener('touchstart',ev=>{ev.preventDefault();ev.stopPropagation();shoot()},{passive:false});for(const id of['sprint','crouch','prone']){const key=id==='sprint'?'sprint':id;$(id).addEventListener('touchstart',ev=>{ev.preventDefault();input[key]=true},{passive:false});$(id).addEventListener('touchend',ev=>{ev.preventDefault();input[key]=false},{passive:false})}$('joystick').addEventListener('touchstart',joyStart,{passive:false});$('joystick').addEventListener('touchmove',joyMove,{passive:false});$('joystick').addEventListener('touchend',joyEnd,{passive:false});document.addEventListener('touchstart',aimStart,{passive:false});document.addEventListener('touchmove',aimMove,{passive:false});document.addEventListener('touchend',()=>aim.on=false)}
function startCountdown(){if(gameState!=='menu')return;gameState='countdown';$('menu').classList.add('hidden');$('countdown').classList.remove('hidden');let n=10;$('count').textContent=n;countdownTimer=setInterval(()=>{n--; $('count').textContent=n;if(n<=0){clearInterval(countdownTimer);$('countdown').classList.add('hidden');$('overlay').classList.add('hidden');gameState='playing';clock.getDelta();setMsg('SURVIVEZ ET ÉLIMINEZ LES CIBLES')}},1000)}
function joyStart(ev){ev.preventDefault();const t=ev.changedTouches[0],r=$('joystick').getBoundingClientRect();joy={on:true,id:t.identifier,cx:r.left+r.width/2,cy:r.top+r.height/2,r:46};joyMove(ev)}function joyMove(ev){ev.preventDefault();if(!joy.on)return;for(const t of ev.changedTouches)if(t.identifier===joy.id){let dx=t.clientX-joy.cx,dy=t.clientY-joy.cy,d=Math.hypot(dx,dy);if(d>joy.r){dx=dx/d*joy.r;dy=dy/d*joy.r}input.s=dx/joy.r;input.f=-dy/joy.r;$('stick').style.transform=`translate(calc(-50% + ${dx}px),calc(-50% + ${dy}px))`}}function joyEnd(ev){ev.preventDefault();joy.on=false;input.f=input.s=0;$('stick').style.transform='translate(-50%,-50%)'}
function aimStart(ev){if(gameState!=='playing')return;for(const t of ev.changedTouches)if(t.clientX>innerWidth*.38&&!t.target.closest('button')){aim={on:true,x:t.clientX,y:t.clientY};break}}function aimMove(ev){if(!aim.on)return;ev.preventDefault();for(const t of ev.changedTouches)if(t.clientX>innerWidth*.38){player.rotation.y-=(t.clientX-aim.x)*.006;pitch.rotation.x=THREE.MathUtils.clamp(pitch.rotation.x-(t.clientY-aim.y)*.006,-1.45,1.45);aim.x=t.clientX;aim.y=t.clientY}}
function shoot(){if(gameState!=='playing')return;const w=WEAPONS[selected],now=performance.now()/1000;if(now-lastShot<1/w.rate)return;lastShot=now;const origin=new THREE.Vector3(),dir=new THREE.Vector3();camera.getWorldPosition(origin);camera.getWorldDirection(dir);for(let p=0;p<w.pellets;p++){const d=dir.clone();d.x+=(Math.random()-.5)*(selected==='shotgun'?.08:.008);d.y+=(Math.random()-.5)*(selected==='shotgun'?.08:.008);d.normalize();const ray=new THREE.Raycaster(origin,d,0,w.range),targets=[];enemies.forEach(enemy=>enemy.traverse(o=>{if(o.isMesh)targets.push(o)}));const hit=ray.intersectObjects(targets,false)[0];if(hit){let part=hit.object.userData.hit,damage=part==='head'?w.damage*2:w.damage;if(selected==='shotgun'&&hit.distance>25)damage=20;let enemy=hit.object;while(enemy.parent&&!enemy.userData.hp)enemy=enemy.parent;if(enemy.userData.hp){enemy.userData.hp-=damage;if(enemy.userData.hp<=0){score+=100;$('score').textContent=score;setMsg('CIBLE ÉLIMINÉE');respawn(enemy)}}}}setMsg('TIR '+w.label)}
function movePlayer(dt){let speed=input.sprint?11:6;if(input.crouch)speed*=.55;if(input.prone)speed*=.3;const old=player.position.clone();player.translateZ(-input.f*speed*dt);player.translateX(input.s*speed*dt);player.position.y=input.prone?.8:input.crouch?1.25:2;for(const o of obstacles)if(player.position.distanceTo(o.mesh.position)<o.r+1.2){player.position.copy(old);break}player.position.x=THREE.MathUtils.clamp(player.position.x,-245,245);player.position.z=THREE.MathUtils.clamp(player.position.z,-245,245)}
function enemyAI(dt){for(const enemy of enemies){if(!enemy.visible)continue;const dx=player.position.x-enemy.position.x,dz=player.position.z-enemy.position.z,dist=Math.hypot(dx,dz);if(dist<90){enemy.rotation.y=Math.atan2(dx,dz);const old=enemy.position.clone();if(dist>16){enemy.translateZ(-enemy.userData.speed*dt);if(obstacles.some(o=>enemy.position.distanceTo(o.mesh.position)<o.r+1)){enemy.position.copy(old);enemy.userData.strafe*=-1}}else enemy.translateX(enemy.userData.strafe*enemy.userData.speed*.5*dt);enemy.userData.nextShot-=dt;if(enemy.userData.nextShot<=0){enemyShoot(enemy,dist);enemy.userData.nextShot=1.1+Math.random()*2.8}}enemy.userData.phase+=dt;enemy.position.y=Math.sin(enemy.userData.phase)*.04}}
function enemyShoot(enemy,dist){if(dist>90||Math.random()>Math.max(.28,1-dist/130))return;const origin=enemy.position.clone();origin.y=1.55;const target=player.position.clone();target.y=input.prone?.8:input.crouch?1.25:2;const d=target.sub(origin).normalize();const ray=new THREE.Raycaster(origin,d,0,100);if(obstacles.some(o=>ray.ray.intersectSphere(new THREE.Sphere(o.mesh.position,o.r))!==null))return;damagePlayer(20)}function damagePlayer(n){hp=Math.max(0,hp-n);$('hpText').textContent=hp;$('hpBar').style.width=hp/2+'%';setMsg('TOUCHÉ -20 HP');if(hp<=0)finish('VOUS ÊTES ÉLIMINÉ')}
function finish(title){gameState='over';$('overlay').classList.remove('hidden');$('end').classList.remove('hidden');$('endTitle').textContent=title;$('endText').textContent='Score : '+score;$('menu').classList.add('hidden');$('countdown').classList.add('hidden')}
function update(dt){if(gameState!=='playing')return;timeLeft-=dt;if(timeLeft<=0)return finish('TEMPS ÉCOULÉ');$('timer').textContent=String(Math.floor(timeLeft/60)).padStart(2,'0')+':'+String(Math.floor(timeLeft%60)).padStart(2,'0');movePlayer(dt);enemyAI(dt)}function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);update(dt);renderer.render(scene,camera)}init();
</script>
</body>
</html>
