<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <title>Haunted Mountain FPS</title>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <style>
    :root {
      --cyan: #00ffd9;
      --gold: #ffcf5a;
      --red: #ff5d7a;
      --bg: rgba(12, 15, 21, 0.8);
      --panel: rgba(15, 17, 24, 0.94);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden; background: linear-gradient(180deg, #160d20, #21152e, #4b4257 50%, #9a655b 100%);
      font-family: monospace; touch-action: none;
    }
    #game { position: fixed; inset: 0; }
    canvas { display: block; }

    #hud {
      position: fixed; z-index: 12; left: 12px; top: 12px; padding: 8px 12px;
      background: rgba(11, 13, 18, 0.7); border-left: 3px solid var(--cyan); color: #dff;
      line-height: 1.55; pointer-events: none; box-shadow: 0 0 16px rgba(0,255,217,.12);
    }
    .bar { width: 150px; height: 10px; background: rgba(70,18,16,.9); border: 1px solid rgba(255,255,255,.2); }
    .fill { width: 100%; height: 100%; background: linear-gradient(90deg, #41f79d, #d8ff78); }
    #reticle {
      position: fixed; z-index: 10; left: 50%; top: 50%; width: 24px; height: 24px; transform: translate(-50%, -50%); pointer-events: none;
    }
    #reticle::before, #reticle::after {
      content: ""; position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(255,255,255,.9); border-radius: 99px;
    }
    #reticle::before { width: 2px; height: 24px; }
    #reticle::after { width: 24px; height: 2px; }

    #overlay {
      position: fixed; inset: 0; z-index: 30; display: flex; align-items: center; justify-content: center;
      padding: 20px; background: rgba(0,0,0,0.78);
    }
    .panel {
      width: min(460px, 92vw); background: var(--panel); border: 1px solid var(--cyan); box-shadow: 0 0 30px rgba(0,255,217,.12);
      border-radius: 10px; padding: 20px 18px; text-align: center; color: white;
    }
    .panel h1 { margin: 0 0 12px; color: var(--cyan); font-size: 26px; }
    .panel p { margin: 8px 0; line-height: 1.5; }
    #weapons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 14px 0; }
    .weapon {
      border: 1px solid var(--cyan); background: rgba(7,20,26,.85); color: white; padding: 10px; font: inherit; border-radius: 6px;
      cursor: pointer;
    }
    .weapon.active { background: var(--cyan); color: #031914; font-weight: bold; }
    .panel button, .control {
      cursor: pointer; border: 1px solid rgba(255,255,255,0.25); background: rgba(31,38,48,.85); color: white; font: inherit; border-radius: 9px;
    }
    .panel button { padding: 12px 16px; }
    #count { font-size: 62px; color: var(--gold); margin: 18px 0; }
    .hidden { display: none !important; }

    #joystick {
      position: fixed; z-index: 14; left: max(18px, env(safe-area-inset-left)); bottom: max(20px, env(safe-area-inset-bottom));
      width: 132px; height: 132px; border-radius: 50%; border: 2px solid rgba(0,255,217,.5); background: rgba(0,255,217,.06);
    }
    #stick {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: 56px; height: 56px; border-radius: 50%; background: rgba(0,255,217,.8); box-shadow: 0 0 12px rgba(0,255,217,.7);
    }

    .control {
      position: fixed; z-index: 15; display: flex; align-items: center; justify-content: center; font-weight: bold; text-transform: uppercase;
      box-shadow: 0 0 12px rgba(255,255,255,.08);
    }
    .control:active { transform: scale(0.96); }
    .round { width: 72px; height: 72px; border-radius: 50%; }
    #fire { right: 22px; bottom: 22px; background: rgba(255,93,122,.75); border-color: rgba(255,93,122,.9); }
    #sprint { left: 170px; bottom: 30px; }
    #crouch, #prone, #jump, #aim, #interact {
      right: 110px; width: 62px; height: 42px; border-radius: 8px;
    }
    #crouch { bottom: 26px; }
    #prone { bottom: 76px; }
    #jump { bottom: 126px; }
    #aim { bottom: 176px; }
    #interact { bottom: 226px; }
    #look { position: fixed; right: 12px; bottom: 120px; z-index: 14; color: rgba(255,255,255,.6); pointer-events: none; }

    @media (max-width: 420px) {
      #hud { font-size: 10px; }
      #sprint { left: 150px; }
      .round { width: 62px; height: 62px; }
      #crouch, #prone, #jump, #aim, #interact { right: 92px; }
    }
  </style>
</head>
<body>
<div id="game"></div>
<div id="reticle"></div>
<div id="hud">
  HP <span id="hpText">200</span>/200
  <div class="bar"><div id="hpBar" class="fill"></div></div>
  ARME <span id="weaponText">AK-47</span><br>
  SCORE <span id="score">0</span> · TEMPS <span id="timer">03:00</span><br>
  <span id="msg">PRÊT</span>
</div>

<div id="overlay">
  <div class="panel" id="menu">
    <h1>HAUNTED MOUNTAIN</h1>
    <p>Choisis une arme, puis lance la partie. Les coffres peuvent donner des soins ou des armes.</p>
    <div id="weapons"></div>
    <button type="button" id="startButton">LANCER LA PARTIE</button>
  </div>
  <div class="panel hidden" id="countdown">
    <h1>PARTIE</h1>
    <div id="count">10</div>
    <p>Le combat commence...</p>
  </div>
  <div class="panel hidden" id="end">
    <h1 id="endTitle">FIN DE PARTIE</h1>
    <p id="endText"></p>
    <button type="button" id="restart">REJOUER</button>
  </div>
</div>

<div id="joystick"><div id="stick"></div></div>
<button class="control round" id="fire" type="button">TIR</button>
<button class="control round" id="sprint" type="button">SPRINT</button>
<button class="control" id="crouch" type="button">BAS</button>
<button class="control" id="prone" type="button">ALLONGÉ</button>
<button class="control" id="jump" type="button">SAUT</button>
<button class="control" id="aim" type="button">AIM</button>
<button class="control" id="interact" type="button">INTER</button>
<div id="look">GLISSEZ À DROITE POUR VISER</div>

<script>
'use strict';
const WEAPONS = {
  sniper: { label:'SNIPER', damage:150, rate:1.25, range:260, pellets:1 },
  ak: { label:'AK-47', damage:30, rate:8, range:180, pellets:1 },
  shotgun: { label:'POMPE', damage:100, rate:1.1, range:58, pellets:8 },
  pistol: { label:'PISTOLET', damage:20, rate:4.5, range:130, pellets:1 }
};

const state = {
  mode: 'menu',
  selected: 'ak',
  score: 0,
  hp: 200,
  timer: 180,
  sprint: false,
  crouch: false,
  prone: false,
  aim: false,
  jump: false,
  onGround: true,
  jumpVelocity: 0,
  impact: 0,
  lastShot: 0
};

const enemies = [];
const coverBlocks = [];
const lootChests = [];
const healingPads = [];
const tracerMeshes = [];
const input = { f:0, s:0 };
const aimTouch = { on:false, x:0, y:0 };
const joy = { on:false, id:null, cx:0, cy:0, r:46 };
const $ = id => document.getElementById(id);
const setMsg = t => { $('msg').textContent = t; };

function init() {
  const sceneRoot = $('game');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2c2440);
  scene.fog = new THREE.Fog(0x2c2440, 35, 260);

  camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 500);
  camera.rotation.order = 'YXZ';

  renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 1.5));
  renderer.setSize(innerWidth, innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  sceneRoot.appendChild(renderer.domElement);

  const hemi = new THREE.HemisphereLight(0xf3ecff, 0x1a2331, 1.3);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffe8bb, 1.8);
  dir.position.set(45, 75, 25);
  dir.castShadow = true;
  dir.shadow.mapSize.set(1024, 1024);
  scene.add(dir);

  buildWorld();
  buildPlayer();
  buildEnemies();
  buildMenu();
  bindControls();
  updateHUD();
  addEventListener('resize', resize);
  animate();
}

function material(color, rough = 1, metal = 0) {
  return new THREE.MeshStandardMaterial({ color, roughness: rough, metalness: metal });
}

function buildWorld() {
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(520, 520), material(0x425d48, 1));
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const path = new THREE.Mesh(new THREE.PlaneGeometry(30, 220), material(0x8a745d, 0.95));
  path.rotation.x = -Math.PI / 2;
  path.position.y = 0.02;
  scene.add(path);

  const hauntedHouse = new THREE.Group();
  const wallMat = material(0x2e2a39, 0.86);
  const roofMat = material(0x15111b, 0.84);
  const glowMat = material(0xffd167, 0.5);
  const base = new THREE.Mesh(new THREE.BoxGeometry(44, 20, 28), wallMat);
  base.position.set(0, 10, -110); base.castShadow = true; base.receiveShadow = true; hauntedHouse.add(base);
  const leftTower = new THREE.Mesh(new THREE.BoxGeometry(12, 22, 12), wallMat); leftTower.position.set(-18, 11, -132); hauntedHouse.add(leftTower);
  const rightTower = leftTower.clone(); rightTower.position.x = 18; hauntedHouse.add(rightTower);
  const roof = new THREE.Mesh(new THREE.ConeGeometry(24, 18, 4), roofMat); roof.position.set(0, 24, -110); roof.rotation.y = Math.PI / 4; hauntedHouse.add(roof);
  const leftRoof = roof.clone(); leftRoof.position.set(-18, 22, -132); hauntedHouse.add(leftRoof);
  const rightRoof = roof.clone(); rightRoof.position.set(18, 22, -132); hauntedHouse.add(rightRoof);
  for (let i = -10; i <= 10; i += 10) {
    const win = new THREE.Mesh(new THREE.BoxGeometry(4.5, 7, 0.5), glowMat); win.position.set(i, 12, -93.2); hauntedHouse.add(win);
    const win2 = win.clone(); win2.position.z = -126.8; hauntedHouse.add(win2);
  }
  const door = new THREE.Mesh(new THREE.BoxGeometry(8, 10, 2), material(0x3a2b2d, 0.8)); door.position.set(0, 5, -90.2); hauntedHouse.add(door);
  scene.add(hauntedHouse);

  for (let i = 0; i < 18; i++) {
    const pum = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 10), material(0xe8692f, 1));
    pum.position.set(-22 + i * 2.5, 1.2, -138 + (i % 2) * 9); pum.scale.y *= 0.8;
    scene.add(pum);
  }

  for (let i = 0; i < 18; i++) {
    const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(2 + Math.random() * 1.8, 0), material(0x6f7269, 1));
    rock.position.set((Math.random()-0.5) * 240, 1.5 + Math.random() * 2.4, (Math.random()-0.5) * 240);
    rock.scale.setScalar(1 + Math.random() * 1.5);
    rock.castShadow = true; rock.receiveShadow = true; scene.add(rock); coverBlocks.push({ mesh: rock, radius: 3.7 });
  }

  for (let i = 0; i < 8; i++) {
    const crate = new THREE.Mesh(new THREE.BoxGeometry(3.2, 3.2, 3.2), material(0x76573a, 1));
    crate.position.set((Math.random() - 0.5) * 180, 1.6, (Math.random() - 0.5) * 160); crate.castShadow = true; scene.add(crate); coverBlocks.push({ mesh: crate, radius: 3.2 });
  }

  for (let i = 0; i < 3; i++) {
    const pad = new THREE.Mesh(new THREE.CylinderGeometry(3, 3, 0.6, 20), material(0x42ffbb, 0.8));
    pad.position.set((i - 1) * 40, 0.35, 70 + i * 20); pad.castShadow = true; healingPads.push(pad); scene.add(pad);
  }

  const chestPositions = [[-80,80],[70,-60],[0,120],[120,0],[-120,-90],[90,90]];
  chestPositions.forEach(([x,z],idx) => {
    const g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.BoxGeometry(3.2, 2, 2), material(0x613d1d, 1)); body.position.y = 1; g.add(body);
    const lid = new THREE.Mesh(new THREE.BoxGeometry(3.2, 0.7, 2.3), material(0x7a4c27, 1)); lid.position.y = 2.2; g.add(lid);
    g.position.set(x, 0, z); g.userData = { opened: false, timer: 0, loot: idx % 2 === 0 ? 'weapon' : 'heal' };
    scene.add(g); lootChests.push(g);
  });
}

function buildPlayer() {
  player = new THREE.Object3D();
  pitch = new THREE.Object3D();
  player.position.set(0, 2, 28);
  camera.position.set(0, 0, 0);
  pitch.add(camera); player.add(pitch); scene.add(player);

  const weapon = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.62, 0.38, 2.2), material(0x1d2126, 0.5, 0.8)); body.position.set(0.8, -0.75, -1.7);
  const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.11, 1.8, 8), material(0xb0bec7, 0.3, 0.9)); barrel.rotation.z = Math.PI / 2; barrel.position.set(1.48, -0.75, -2.7);
  const grip = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.7, 0.2), material(0x171717, 0.9, 0.2)); grip.position.set(0.62, -1.15, -0.8);
  weapon.add(body, barrel, grip); weapon.position.set(0.45, 0, 0.1); camera.add(weapon);
}

function humanoid() {
  const g = new THREE.Group();
  const skin = material(0xe3bf9b, 0.9);
  const cloth = material(0x7b2d39, 1);
  const dark = material(0x20242d, 0.9);
  const metal = material(0xb6c1d2, 0.45, 0.9);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.7, 12, 10), skin); head.position.y = 2.45; head.userData.hit = 'head';
  const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.7, 0.85, 1.55, 10), cloth); torso.position.y = 1.15; torso.userData.hit = 'torso';
  const hip = new THREE.Mesh(new THREE.BoxGeometry(1, 0.42, 0.7), dark); hip.position.y = 0.3;

  const leftArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 1.2, 4, 8), skin); leftArm.position.set(-0.9, 1.1, 0); leftArm.rotation.z = -0.4;
  const rightArm = new THREE.Mesh(new THREE.CapsuleGeometry(0.18, 1.2, 4, 8), skin); rightArm.position.set(0.9, 1.1, 0); rightArm.rotation.z = 0.4;
  const leftLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.6, 4, 8), dark); leftLeg.position.set(-0.32, -0.78, 0);
  const rightLeg = new THREE.Mesh(new THREE.CapsuleGeometry(0.22, 1.6, 4, 8), dark); rightLeg.position.set(0.32, -0.78, 0);

  const gun = new THREE.Group();
  const gunBody = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.18, 1.2), metal); gunBody.position.set(0.6, 0.9, 0.85); gun.add(gunBody);
  const gunBarrel = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1, 8), metal); gunBarrel.rotation.z = Math.PI / 2; gunBarrel.position.set(1.02, 0.9, 1.45); gun.add(gunBarrel);
  g.add(head, torso, hip, leftArm, rightArm, leftLeg, rightLeg, gun);

  g.userData = { hp: 100, nextShot: 2, phase: Math.random()*6.28, speed: 2.2 + Math.random()*2, strafe: Math.random() > 0.5 ? 1 : -1 };
  return g;
}

function buildEnemies() {
  for (let i = 0; i < 8; i++) {
    const e = humanoid();
    respawnEnemy(e);
    scene.add(e);
    enemies.push(e);
  }
}

function respawnEnemy(enemy) {
  let x = 0, z = 0;
  do { x = (Math.random() - 0.5) * 210; z = (Math.random() - 0.5) * 210; } while (Math.hypot(x - player.position.x, z - player.position.z) < 35);
  enemy.position.set(x, 0, z);
  enemy.userData.hp = 100;
  enemy.userData.nextShot = 1.4 + Math.random() * 2.8;
  enemy.visible = true;
}

function buildMenu() {
  const root = $('weapons'); root.innerHTML = '';
  Object.keys(WEAPONS).forEach(key => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'weapon' + (key === state.selected ? ' active' : '');
    btn.textContent = WEAPONS[key].label;
    btn.addEventListener('click', () => {
      state.selected = key;
      root.querySelectorAll('.weapon').forEach(el => el.classList.remove('active'));
      btn.classList.add('active');
      $('weaponText').textContent = WEAPONS[key].label;
      setMsg('ARME : ' + WEAPONS[key].label);
    });
    root.appendChild(btn);
  });
}

function bindControls() {
  $('startButton').addEventListener('click', startCountdown);
  $('restart').addEventListener('click', () => location.reload());

  $('fire').addEventListener('touchstart', (e) => { e.preventDefault(); shoot(); }, { passive:false });
  $('sprint').addEventListener('touchstart', (e) => { e.preventDefault(); state.sprint = !state.sprint; $('sprint').style.background = state.sprint ? 'rgba(153,255,141,.8)' : 'rgba(29,38,44,.8)'; }, { passive:false });
  $('crouch').addEventListener('touchstart', (e) => { e.preventDefault(); state.crouch = !state.crouch; if (state.crouch) state.prone = false; }, { passive:false });
  $('prone').addEventListener('touchstart', (e) => { e.preventDefault(); state.prone = !state.prone; if (state.prone) state.crouch = false; }, { passive:false });
  $('jump').addEventListener('touchstart', (e) => { e.preventDefault(); if (state.onGround) { state.jump = true; state.onGround = false; } }, { passive:false });
  $('aim').addEventListener('touchstart', (e) => { e.preventDefault(); state.aim = !state.aim; }, { passive:false });
  $('interact').addEventListener('touchstart', (e) => { e.preventDefault(); interact(); }, { passive:false });

  $('joystick').addEventListener('touchstart', joyStart, { passive:false });
  $('joystick').addEventListener('touchmove', joyMove, { passive:false });
  $('joystick').addEventListener('touchend', joyEnd, { passive:false });
  document.addEventListener('touchstart', aimStart, { passive:false });
  document.addEventListener('touchmove', aimMove, { passive:false });
  document.addEventListener('touchend', () => { aimTouch.on = false; }, { passive:false });
}

function startCountdown() {
  if (state.mode !== 'menu') return;
  state.mode = 'countdown';
  $('menu').classList.add('hidden');
  $('countdown').classList.remove('hidden');
  let count = 10; $('count').textContent = count;
  const iv = setInterval(() => {
    count -= 1; $('count').textContent = count;
    if (count <= 0) {
      clearInterval(iv);
      $('overlay').classList.add('hidden');
      $('countdown').classList.add('hidden');
      state.mode = 'playing';
      state.timer = 180;
      setMsg('SURVIVEZ ET ÉLIMINEZ LES CIBLES');
    }
  }, 1000);
}

function joyStart(e) {
  const t = e.changedTouches[0];
  const r = $('joystick').getBoundingClientRect();
  joy.on = true; joy.id = t.identifier; joy.cx = r.left + r.width / 2; joy.cy = r.top + r.height / 2;
  joyMove(e);
}

function joyMove(e) {
  if (!joy.on) return;
  for (const t of e.changedTouches) {
    if (t.identifier === joy.id) {
      let dx = t.clientX - joy.cx; let dy = t.clientY - joy.cy; const d = Math.hypot(dx, dy);
      if (d > joy.r) { dx = dx / d * joy.r; dy = dy / d * joy.r; }
      input.s = dx / joy.r; input.f = -dy / joy.r;
      $('stick').style.transform = `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
      return;
    }
  }
}

function joyEnd() { joy.on = false; input.f = 0; input.s = 0; $('stick').style.transform = 'translate(-50%, -50%)'; }

function aimStart(e) {
  if (state.mode !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.clientX > innerWidth * 0.35 && !t.target.closest('button')) {
      aimTouch.on = true; aimTouch.x = t.clientX; aimTouch.y = t.clientY; break;
    }
  }
}

function aimMove(e) {
  if (!aimTouch.on || state.mode !== 'playing') return;
  for (const t of e.changedTouches) {
    if (t.clientX <= innerWidth * 0.35) continue;
    const dx = t.clientX - aimTouch.x; const dy = t.clientY - aimTouch.y;
    player.rotation.y -= dx * 0.006;
    pitch.rotation.x = THREE.MathUtils.clamp(pitch.rotation.x - dy * 0.006, -1.45, 1.45);
    aimTouch.x = t.clientX; aimTouch.y = t.clientY; break;
  }
}

function shoot() {
  if (state.mode !== 'playing') return;
  const w = WEAPONS[state.selected];
  const now = performance.now() / 1000;
  if (now - state.lastShot < 1 / w.rate) return;
  state.lastShot = now;
  state.impact = 0.17;

  const origin = new THREE.Vector3();
  const dir = new THREE.Vector3();
  camera.getWorldPosition(origin);
  camera.getWorldDirection(dir);

  const targets = [];
  enemies.forEach(enemy => enemy.traverse(obj => { if (obj.isMesh) targets.push(obj); }));

  for (let i = 0; i < w.pellets; i++) {
    const d = dir.clone();
    d.x += (Math.random() - 0.5) * (state.selected === 'shotgun' ? 0.08 : 0.012);
    d.y += (Math.random() - 0.5) * (state.selected === 'shotgun' ? 0.08 : 0.012);
    d.normalize();
    const ray = new THREE.Raycaster(origin, d, 0, w.range);
    const hit = ray.intersectObjects(targets, false)[0];
    if (!hit) continue;
    let obj = hit.object;
    while (obj && !obj.userData.hp && obj.parent) obj = obj.parent;
    if (!obj || !obj.userData || !obj.userData.hp) continue;

    const hitPart = hit.object.userData.hit || 'torso';
    let dmg = hitPart === 'head' ? w.damage * 2 : w.damage;
    if (state.selected === 'shotgun' && hit.distance > 18) dmg = 20;
    if (state.selected === 'sniper' && hit.distance < 80) dmg *= 1.25;

    obj.userData.hp -= dmg;
    if (obj.userData.hp <= 0) {
      obj.visible = false;
      state.score += 100;
      $('score').textContent = state.score;
      setMsg('CIBLE ÉLIMINÉE');
      respawnEnemy(obj.parent || obj);
    } else if (hitPart === 'head') {
      setMsg('HEADSHOT');
    }
  }

  spawnTracer(origin, dir, w.range);
  setMsg('TIR ' + WEAPONS[state.selected].label);
}

function spawnTracer(origin, dir, range) {
  const tracer = new THREE.Mesh(new THREE.SphereGeometry(0.08, 6, 6), new THREE.MeshBasicMaterial({ color: 0xfff7b2 }));
  tracer.position.copy(origin.clone().add(dir.clone().multiplyScalar(0.7)));
  tracer.userData = { velocity: dir.clone().multiplyScalar(90), life: 0.08 };
  scene.add(tracer);
  tracerMeshes.push(tracer);
}

function updateTracers(dt) {
  for (let i = tracerMeshes.length - 1; i >= 0; i--) {
    const t = tracerMeshes[i];
    t.position.addScaledVector(t.userData.velocity, dt);
    t.userData.life -= dt;
    if (t.userData.life <= 0) { scene.remove(t); tracerMeshes.splice(i, 1); }
  }
}

function interact() {
  if (state.mode !== 'playing') return;
  for (const chest of lootChests) {
    const dist = chest.position.distanceTo(player.position);
    if (!chest.userData.opened && dist < 8) {
      chest.userData.opened = true;
      chest.userData.timer = 0.9;
      const lid = chest.children[1]; if (lid) lid.rotation.x = -1.2;
      spawnPumpkinBurst(chest.position.clone());
      if (chest.userData.loot === 'heal') {
        state.hp = Math.min(200, state.hp + 25);
        setMsg('SOIN +25');
      } else {
        const keys = Object.keys(WEAPONS);
        state.selected = keys[Math.floor(Math.random() * keys.length)];
        buildMenu();
        setMsg('ARME : ' + WEAPONS[state.selected].label);
      }
      updateHUD();
      return;
    }
  }

  for (const pad of healingPads) {
    if (pad.position.distanceTo(player.position) < 7) {
      state.hp = Math.min(200, state.hp + 18);
      setMsg('PAD DE SOIN');
      updateHUD();
      return;
    }
  }
}

function spawnPumpkinBurst(pos) {
  for (let i = 0; i < 12; i++) {
    const p = new THREE.Mesh(new THREE.SphereGeometry(0.18, 8, 8), new THREE.MeshBasicMaterial({ color: 0xf57c2d }));
    p.position.copy(pos.clone().add(new THREE.Vector3((Math.random() - 0.5) * 2.4, 0.8, (Math.random() - 0.5) * 2.4)));
    p.userData = { velocity: new THREE.Vector3((Math.random() - 0.5) * 8, 4 + Math.random() * 4, (Math.random() - 0.5) * 8), life: 0.8 };
    scene.add(p);
    tracerMeshes.push(p);
  }
}

function updateLoot(dt) {
  for (const chest of lootChests) {
    if (chest.userData.opened && chest.userData.timer > 0) {
      chest.userData.timer -= dt;
      const lid = chest.children[1];
      lid.rotation.x = THREE.MathUtils.lerp(lid.rotation.x, -0.08, 0.12);
    }
  }
}

function updatePlayer(dt) {
  if (state.mode !== 'playing') return;

  let speed = state.sprint ? 11 : state.crouch ? 4.5 : state.prone ? 2.5 : 6.5;
  if (state.aim) speed *= 0.8;

  if (state.jump && !state.onGround) {
    state.jumpVelocity = 5.8;
    state.jump = false;
  }

  const prev = player.position.clone();
  player.translateZ(-input.f * speed * dt);
  player.translateX(input.s * speed * dt);

  for (const block of coverBlocks) {
    if (player.position.distanceTo(block.mesh.position) < block.radius + 1.5) {
      player.position.copy(prev);
      break;
    }
  }

  player.position.x = THREE.MathUtils.clamp(player.position.x, -240, 240);
  player.position.z = THREE.MathUtils.clamp(player.position.z, -240, 240);

  if (state.jump || !state.onGround) {
    state.jumpVelocity -= 8.6 * dt;
    player.position.y += state.jumpVelocity * dt;
    if (player.position.y <= 2) {
      player.position.y = 2; state.onGround = true; state.jumpVelocity = 0; state.jump = false;
    } else {
      state.onGround = false;
    }
  }

  const camY = state.prone ? 0.5 : state.crouch ? 1.0 : 1.6;
  camera.position.y = camY;
  if (state.aim) {
    camera.rotation.x = pitch.rotation.x;
  }
}

function updateEnemies(dt) {
  for (const enemy of enemies) {
    if (!enemy.visible) continue;
    enemy.userData.phase += dt * 3;
    const dx = player.position.x - enemy.position.x;
    const dz = player.position.z - enemy.position.z;
    const dist = Math.hypot(dx, dz);

    if (dist < 120) {
      enemy.rotation.y = Math.atan2(dx, dz) + Math.PI;
      if (dist > 18) {
        enemy.position.x += (dx / dist) * enemy.userData.speed * dt * 1.3;
        enemy.position.z += (dz / dist) * enemy.userData.speed * dt * 1.3;
      }
      enemy.userData.nextShot -= dt;
      if (dist < 90 && enemy.userData.nextShot <= 0) {
        shootEnemy(enemy);
        enemy.userData.nextShot = 1.5 + Math.random() * 2.5;
      }
    }

    const walk = Math.sin(enemy.userData.phase * 2.5) * 0.8;
    enemy.children[3].rotation.x = walk * 0.5; // leftArm
    enemy.children[4].rotation.x = -walk * 0.5; // rightArm
    enemy.children[5].rotation.x = -walk * 0.8; // leftLeg
    enemy.children[6].rotation.x = walk * 0.8; // rightLeg
    enemy.position.y = Math.sin(enemy.userData.phase * 1.5) * 0.03;
  }
}

function shootEnemy(enemy) {
  const origin = enemy.position.clone().add(new THREE.Vector3(0, 1.6, 0));
  const dir = player.position.clone().add(new THREE.Vector3(0, 1.2, 0)).sub(origin).normalize();
  const ray = new THREE.Raycaster(origin, dir, 0, 90);
  let blocked = false;
  const spheres = coverBlocks.map(block => new THREE.Sphere(block.mesh.position, block.radius + 0.8));
  for (const sphere of spheres) {
    if (ray.ray.intersectSphere(sphere) !== null) { blocked = true; break; }
  }
  if (blocked) return;

  state.hp = Math.max(0, state.hp - 20);
  state.impact = 0.18;
  updateHUD();
  setMsg('ENNEMI TIRE -20');
  if (state.hp <= 0) finishGame('DÉFAIT');
}

function finishGame(label) {
  state.mode = 'over';
  $('overlay').classList.remove('hidden');
  $('end').classList.remove('hidden');
  $('endTitle').textContent = label;
  $('endText').textContent = 'Score final : ' + state.score + ' • HP restants : ' + state.hp;
}

function updateHUD() {
  $('hpText').textContent = String(state.hp);
  $('hpBar').style.width = ((state.hp / 200) * 100) + '%';
  $('score').textContent = String(state.score);
  $('weaponText').textContent = WEAPONS[state.selected].label;
  $('timer').textContent = formatTime(state.timer);
}

function formatTime(seconds) {
  const m = String(Math.floor(seconds / 60)).padStart(2, '0');
  const s = String(Math.floor(seconds % 60)).padStart(2, '0');
  return m + ':' + s;
}

function updateGame(dt) {
  if (state.mode !== 'playing') return;
  state.timer -= dt;
  if (state.timer <= 0) {
    finishGame('TEMPS ÉCOULÉ');
    return;
  }
  updateHUD();
  updatePlayer(dt);
  updateEnemies(dt);
  updateTracers(dt);
  updateLoot(dt);
  state.impact = Math.max(0, state.impact - dt * 2.5);
  if (state.impact > 0) {
    camera.rotation.x += (Math.random() - 0.5) * 0.06 * state.impact;
    camera.rotation.y += (Math.random() - 0.5) * 0.05 * state.impact;
  }
  for (const pad of healingPads) {
    pad.rotation.y += dt * 0.8;
    if (pad.position.distanceTo(player.position) < 7) {
      state.hp = Math.min(200, state.hp + 7 * dt);
      updateHUD();
    }
  }
}

function resize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
}

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  updateGame(dt);
  renderer.render(scene, camera);
}

let clock = new THREE.Clock();
init();
</script>
</body>
