<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<title>Neon Mobile FPS</title>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #030407;
    font-family: monospace;
    touch-action: none;
}

#game {
    position: fixed;
    inset: 0;
}

canvas {
    display: block;
}

#hud {
    position: fixed;
    top: max(12px, env(safe-area-inset-top));
    left: max(12px, env(safe-area-inset-left));
    z-index: 5;
    color: #00ffcc;
    background: rgba(0, 0, 0, .65);
    border-left: 3px solid #00ffcc;
    padding: 8px 12px;
    font-size: 12px;
    line-height: 1.5;
    pointer-events: none;
}

#reticle {
    position: fixed;
    z-index: 4;
    top: 50%;
    left: 50%;
    width: 12px;
    height: 12px;
    border: 2px solid #00ffcc;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    box-shadow: 0 0 8px #00ffcc;
}

#start {
    position: fixed;
    inset: 0;
    z-index: 20;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 25px;
    color: white;
    text-align: center;
    background: rgba(0, 0, 0, .92);
}

#startBox {
    width: min(430px, 100%);
    padding: 24px;
    border: 1px solid #00ffcc;
    box-shadow: 0 0 25px rgba(0, 255, 204, .35);
}

#start h1 {
    color: #00ffcc;
    font-size: 22px;
}

#start button {
    margin-top: 15px;
    padding: 14px 22px;
    color: #00110d;
    background: #00ffcc;
    border: 0;
    border-radius: 6px;
    font-family: monospace;
    font-weight: bold;
    font-size: 16px;
}

#joystick {
    position: fixed;
    z-index: 10;
    left: max(25px, env(safe-area-inset-left));
    bottom: max(25px, env(safe-area-inset-bottom));
    width: 135px;
    height: 135px;
    border: 2px solid rgba(0, 255, 204, .45);
    border-radius: 50%;
    background: rgba(0, 255, 204, .08);
}

#stick {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 58px;
    height: 58px;
    border-radius: 50%;
    background: rgba(0, 255, 204, .75);
    box-shadow: 0 0 15px #00ffcc;
    transform: translate(-50%, -50%);
}

#fire {
    position: fixed;
    z-index: 10;
    right: max(25px, env(safe-area-inset-right));
    bottom: max(35px, env(safe-area-inset-bottom));
    width: 88px;
    height: 88px;
    border: 2px solid #ff3366;
    border-radius: 50%;
    color: white;
    background: rgba(255, 51, 102, .35);
    font-family: monospace;
    font-weight: bold;
    box-shadow: 0 0 18px rgba(255, 51, 102, .65);
}

#fire:active {
    background: rgba(255, 51, 102, .8);
    transform: scale(.94);
}

#lookHelp {
    position: fixed;
    right: 15px;
    bottom: 135px;
    z-index: 5;
    color: rgba(255,255,255,.55);
    font-size: 10px;
    pointer-events: none;
}

@media (orientation: portrait) {
    #startBox::after {
        content: "Pour une meilleure expérience, utilisez le mode paysage.";
        display: block;
        margin-top: 18px;
        color: #ffcc00;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="game"></div>

<div id="hud">
    SCORE : <span id="score">0</span><br>
    POSITION :
    <span id="position">0 / 0</span><br>
    <span id="message">PRÊT</span>
</div>

<div id="reticle"></div>

<div id="start">
    <div id="startBox">
        <h1>NEON MOBILE FPS</h1>
        <p>Jeu FPS optimisé pour Safari mobile.</p>
        <p>
            Joystick gauche : déplacement<br>
            Glissez à droite : regarder<br>
            Bouton rouge : tirer
        </p>
        <button id="startButton">LANCER LE JEU</button>
    </div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="fire">TIR</button>

<div id="lookHelp">GLISSEZ À DROITE POUR VISER</div>

<script>
"use strict";

let scene;
let camera;
let renderer;
let player;
let pitch;
let clock;

const enemies = [];
const bullets = [];

let score = 0;
let started = false;

const input = {
    forward: 0,
    side: 0
};

const aim = {
    active: false,
    lastX: 0,
    lastY: 0
};

const joystick = {
    active: false,
    id: null,
    centerX: 0,
    centerY: 0,
    radius: 47
};

const scoreElement = document.getElementById("score");
const positionElement = document.getElementById("position");
const messageElement = document.getElementById("message");
const joystickElement = document.getElementById("joystick");
const stickElement = document.getElementById("stick");
const fireButton = document.getElementById("fire");

function init() {
    clock = new THREE.Clock();

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020308);
    scene.fog = new THREE.FogExp2(0x020308, 0.018);

    camera = new THREE.PerspectiveCamera(
        70,
        window.innerWidth / window.innerHeight,
        0.1,
        500
    );

    renderer = new THREE.WebGLRenderer({
        antialias: false,
        powerPreference: "high-performance"
    });

    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById("game").appendChild(renderer.domElement);

    createLights();
    createWorld();
    createPlayer();
    createEnemies();
    createControls();

    window.addEventListener("resize", resize);
    window.addEventListener("orientationchange", resize);

    animate();
}

function createLights() {
    scene.add(new THREE.HemisphereLight(0x446688, 0x080812, 0.9));

    const light = new THREE.PointLight(0x00ffcc, 2, 80);
    light.position.set(0, 12, 0);
    scene.add(light);
}

function createWorld() {
    const floorGeometry = new THREE.PlaneGeometry(500, 500, 40, 40);
    const floorMaterial = new THREE.MeshBasicMaterial({
        color: 0x10151c,
        wireframe: true
    });

    const floor = new THREE.Mesh(floorGeometry, floorMaterial);
    floor.rotation.x = -Math.PI / 2;
    scene.add(floor);

    const pillarGeometry = new THREE.BoxGeometry(3, 18, 3);
    const pillarMaterial = new THREE.MeshLambertMaterial({
        color: 0x202632
    });

    for (let i = 0; i < 22; i++) {
        const pillar = new THREE.Mesh(
            pillarGeometry,
            pillarMaterial
        );

        pillar.position.set(
            (Math.random() - .5) * 220,
            9,
            (Math.random() - .5) * 220
        );

        scene.add(pillar);
    }
}

function createPlayer() {
    player = new THREE.Object3D();
    pitch = new THREE.Object3D();

    player.position.set(0, 2, 25);

    pitch.add(camera);
    player.add(pitch);
    scene.add(player);
}

function createEnemies() {
    const geometry = new THREE.BoxGeometry(3, 3, 3);

    for (let i = 0; i < 12; i++) {
        const material = new THREE.MeshLambertMaterial({
            color: 0xff3366,
            emissive: 0x660022
        });

        const enemy = new THREE.Mesh(geometry, material);
        enemy.userData.enemy = true;

        respawn(enemy);
        scene.add(enemy);
        enemies.push(enemy);
    }
}

function respawn(enemy) {
    let x;
    let z;

    do {
        x = (Math.random() - .5) * 210;
        z = (Math.random() - .5) * 210;
    } while (Math.hypot(x - player.position.x, z - player.position.z) < 25);

    enemy.position.set(x, 1.5, z);
    enemy.rotation.set(
        Math.random(),
        Math.random(),
        Math.random()
    );
}

function createControls() {
    document.getElementById("startButton").addEventListener("click", () => {
        started = true;
        document.getElementById("start").style.display = "none";
        resize();
    });

    joystickElement.addEventListener("touchstart", joystickStart, {
        passive: false
    });

    joystickElement.addEventListener("touchmove", joystickMove, {
        passive: false
    });

    joystickElement.addEventListener("touchend", joystickEnd, {
        passive: false
    });

    joystickElement.addEventListener("touchcancel", joystickEnd, {
        passive: false
    });

    document.addEventListener("touchstart", aimStart, {
        passive: false
    });

    document.addEventListener("touchmove", aimMove, {
        passive: false
    });

    document.addEventListener("touchend", aimEnd, {
        passive: false
    });

    fireButton.addEventListener("touchstart", (event) => {
        event.preventDefault();

        if (started) {
            shoot();
        }
    }, { passive: false });
}

function joystickStart(event) {
    event.preventDefault();

    const touch = event.changedTouches[0];
    const rect = joystickElement.getBoundingClientRect();

    joystick.active = true;
    joystick.id = touch.identifier;
    joystick.centerX = rect.left + rect.width / 2;
    joystick.centerY = rect.top + rect.height / 2;

    updateJoystick(touch.clientX, touch.clientY);
}

function joystickMove(event) {
    event.preventDefault();

    if (!joystick.active) return;

    for (const touch of event.changedTouches) {
        if (touch.identifier === joystick.id) {
            updateJoystick(touch.clientX, touch.clientY);
        }
    }
}

function joystickEnd(event) {
    event.preventDefault();

    for (const touch of event.changedTouches) {
        if (touch.identifier === joystick.id) {
            joystick.active = false;
            joystick.id = null;
            input.forward = 0;
            input.side = 0;
            stickElement.style.transform = "translate(-50%, -50%)";
        }
    }
}

function updateJoystick(x, y) {
    let dx = x - joystick.centerX;
    let dy = y - joystick.centerY;

    const distance = Math.hypot(dx, dy);

    if (distance > joystick.radius) {
        dx = dx / distance * joystick.radius;
        dy = dy / distance * joystick.radius;
    }

    input.side = dx / joystick.radius;
    input.forward = -dy / joystick.radius;

    stickElement.style.transform =
        `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

function aimStart(event) {
    if (!started) return;

    for (const touch of event.changedTouches) {
        if (touch.clientX > window.innerWidth * .38) {
            aim.active = true;
            aim.lastX = touch.clientX;
            aim.lastY = touch.clientY;
        }
    }
}

function aimMove(event) {
    if (!aim.active) return;

    event.preventDefault();

    for (const touch of event.changedTouches) {
        if (touch.clientX <= window.innerWidth * .38) continue;

        const dx = touch.clientX - aim.lastX;
        const dy = touch.clientY - aim.lastY;

        player.rotation.y -= dx * .006;
        pitch.rotation.x -= dy * .006;

        pitch.rotation.x = THREE.MathUtils.clamp(
            pitch.rotation.x,
            -1.45,
            1.45
        );

        aim.lastX = touch.clientX;
        aim.lastY = touch.clientY;
    }
}

function aimEnd() {
    aim.active = false;
}

function shoot() {
    const geometry = new THREE.SphereGeometry(.22, 6, 6);
    const material = new THREE.MeshBasicMaterial({
        color: 0x00ffcc
    });

    const bullet = new THREE.Mesh(geometry, material);
    const direction = new THREE.Vector3();

    camera.getWorldPosition(bullet.position);
    camera.getWorldDirection(direction);

    bullet.userData.velocity = direction.multiplyScalar(95);
    bullet.userData.life = 2;

    scene.add(bullet);
    bullets.push(bullet);

    messageElement.textContent = "LASER ACTIF";
}

function updatePlayer(delta) {
    if (!started) return;

    const speed = 32;

    player.translateZ(-input.forward * speed * delta);
    player.translateX(input.side * speed * delta);

    player.position.x = THREE.MathUtils.clamp(
        player.position.x,
        -240,
        240
    );

    player.position.z = THREE.MathUtils.clamp(
        player.position.z,
        -240,
        240
    );

    positionElement.textContent =
        `${player.position.x.toFixed(0)} / ${player.position.z.toFixed(0)}`;
}

function updateBullets(delta) {
    for (let i = bullets.length - 1; i >= 0; i--) {
        const bullet = bullets[i];

        bullet.position.addScaledVector(
            bullet.userData.velocity,
            delta
        );

        bullet.userData.life -= delta;

        let hit = false;

        for (const enemy of enemies) {
            if (bullet.position.distanceTo(enemy.position) < 2.4) {
                score += 100;
                scoreElement.textContent = score;
                messageElement.textContent = "CIBLE ÉLIMINÉE";

                respawn(enemy);
                hit = true;
                break;
            }
        }

        if (hit || bullet.userData.life <= 0) {
            scene.remove(bullet);
            bullets.splice(i, 1);
        }
    }
}

function updateEnemies(delta) {
    for (const enemy of enemies) {
        enemy.rotation.x += delta;
        enemy.rotation.y += delta * 1.5;
    }
}

function resize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();

    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );
}

function animate() {
    requestAnimationFrame(animate);

    const delta = Math.min(clock.getDelta(), .05);

    updatePlayer(delta);
    updateBullets(delta);
    updateEnemies(delta);

    renderer.render(scene, camera);
}

init();
</script>

</body>
</html>
